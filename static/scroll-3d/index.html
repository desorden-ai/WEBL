<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>SOL — Scroll 3D</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000}body{overscroll-behavior-y:none;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.scrub{position:relative;height:600vh;background:#000}.scrub__sticky{position:sticky;top:0;width:100%;height:100svh;overflow:hidden;background:#000}.scrub__video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;background:#000;transform:translateZ(0);will-change:contents}.scrub__shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 20%,transparent 78%,rgba(0,0,0,.28));opacity:.55}.scrub__hint{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(0,0,0,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;opacity:.8;transition:opacity .35s ease;pointer-events:none}.scrub.is-engaged .scrub__hint{opacity:0}.scrub__progress{position:absolute;left:0;bottom:0;width:100%;height:2px;background:rgba(255,255,255,.12);pointer-events:none}.scrub__progress>i{display:block;width:100%;height:100%;background:rgba(255,255,255,.88);transform:scaleX(0);transform-origin:0 50%;will-change:transform}.scrub__loading{position:absolute;inset:0;display:grid;place-items:center;z-index:2;background:#000;transition:opacity .35s ease,visibility .35s ease}.scrub__loading[hidden]{opacity:0;visibility:hidden;pointer-events:none}.scrub__loading span{width:28px;aspect-ratio:1;border:1px solid rgba(255,255,255,.22);border-top-color:rgba(255,255,255,.9);border-radius:50%;animation:spin .8s linear infinite}.scrub__error{position:absolute;inset:0;display:none;place-items:center;padding:24px;z-index:3;background:#000;color:rgba(255,255,255,.72);text-align:center;font-size:13px;line-height:1.5}.scrub.has-error .scrub__error{display:grid}@keyframes spin{to{transform:rotate(360deg)}}@media(min-aspect-ratio:1/1){.scrub__video{object-fit:contain}.scrub__shade{opacity:.25}}@media(prefers-reduced-motion:reduce){.scrub{height:100svh}.scrub__hint,.scrub__progress{display:none}}
  </style>
</head>
<body>
  <main class="scrub" id="scroll3d">
    <div class="scrub__sticky">
      <video class="scrub__video" id="scroll3dVideo" src="./source.mp4" preload="auto" playsinline muted webkit-playsinline aria-label="Recorrido arquitectónico 3D controlado por scroll"></video>
      <div class="scrub__shade"></div>
      <div class="scrub__hint">Desliza para explorar</div>
      <div class="scrub__progress"><i id="scroll3dProgress"></i></div>
      <div class="scrub__loading" id="scroll3dLoading"><span aria-hidden="true"></span></div>
      <div class="scrub__error">No se ha podido cargar el vídeo de recorrido 3D.</div>
    </div>
  </main>
  <script>
    (()=>{const section=document.getElementById('scroll3d'),video=document.getElementById('scroll3dVideo'),progressBar=document.getElementById('scroll3dProgress'),loading=document.getElementById('scroll3dLoading'),reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches,FPS=24;let duration=0,targetTime=0,currentTime=0,raf=0,engaged=false,unlocked=false;const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));const getProgress=()=>{const rect=section.getBoundingClientRect(),distance=Math.max(1,section.offsetHeight-window.innerHeight);return clamp(-rect.top/distance,0,1)};const paint=()=>{raf=0;if(!duration||reducedMotion)return;const progress=getProgress(),lastFrameTime=Math.max(0,duration-(1/FPS));targetTime=progress*lastFrameTime;currentTime+=(targetTime-currentTime)*.34;if(Math.abs(targetTime-currentTime)<.0025)currentTime=targetTime;if(Math.abs(video.currentTime-currentTime)>.004){try{video.currentTime=currentTime}catch(_){}}progressBar.style.transform=`scaleX(${progress})`;if(!engaged&&progress>.008){engaged=true;section.classList.add('is-engaged')}if(Math.abs(targetTime-currentTime)>.0025)raf=requestAnimationFrame(paint)};const requestPaint=()=>{if(!raf)raf=requestAnimationFrame(paint)};const unlock=async()=>{if(unlocked||reducedMotion)return;unlocked=true;try{await video.play();video.pause();video.currentTime=currentTime}catch(_){}};video.addEventListener('loadedmetadata',()=>{duration=Number.isFinite(video.duration)?video.duration:10.005;currentTime=targetTime=.001;try{video.currentTime=currentTime}catch(_){}loading.hidden=true;requestPaint()},{once:true});video.addEventListener('error',()=>{loading.hidden=true;section.classList.add('has-error')},{once:true});window.addEventListener('scroll',requestPaint,{passive:true});window.addEventListener('resize',requestPaint,{passive:true});window.addEventListener('pointerdown',unlock,{passive:true,once:true});window.addEventListener('touchstart',unlock,{passive:true,once:true});if(reducedMotion){loading.hidden=true;video.currentTime=.001}})();
  </script>
</body>
</html>
