name: Export previous mansion source

on:
  push:
    branches:
      - agent/mansion-refugio-3d-base
    paths:
      - .github/workflows/export-old-viewport.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout previous mansion branch
        uses: actions/checkout@v4
        with:
          ref: agent/mansion-refugio-3d
      - name: Export previous source tree
        run: |
          rm -rf .git
      - name: Upload previous source
        uses: actions/upload-artifact@v4
        with:
          name: previous-mansion-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
