name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Regenerate exterior model
        run: npm run generate:model

      - name: Verify generated model is committed
        run: git diff --exit-code -- static/models/exterior/house-exterior.glb

      - name: Test and build
        run: npm run check
