name: Check Bosque

on:
  push:
    branches:
      - bosque
  pull_request:
    branches:
      - bosque

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test hero architecture and build
        run: npm run check
