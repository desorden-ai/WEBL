name: Apply Realistic Forest V2 Once

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-realistic-forest-v2.mjs
      - .github/workflows/apply-realistic-forest-v2-once.yml

permissions:
  contents: write

concurrency:
  group: mansion-realistic-forest-v2
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply reference-driven 3D forest
        run: node scripts/apply-realistic-forest-v2.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build -- --base=./

      - name: Commit validated forest and remove one-shot files
        shell: bash
        run: |
          rm -f scripts/apply-realistic-forest-v2.mjs
          rm -f .github/workflows/apply-realistic-forest-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No forest migration changes to commit."
            exit 0
          fi
          git commit -m "Replace billboard forest with textured 3D conifers"
          git push origin HEAD:main
