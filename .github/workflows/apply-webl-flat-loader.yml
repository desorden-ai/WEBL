name: Apply WEBL flat loader and faster scrub

on:
  push:
    branches:
      - SOL
    paths:
      - .github/workflows/apply-webl-flat-loader.yml

permissions:
  contents: write

concurrency:
  group: apply-webl-flat-loader
  cancel-in-progress: true

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Patch loader and scrub sensitivity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('static/scroll.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  r'''    \.loader-stage\{position:relative;width:min\(52vw,230px\);aspect-ratio:1;display:grid;place-items:center;perspective:950px\}\n    \.letter-box\{position:relative;width:100%;height:100%;display:grid;place-items:center;transform-style:preserve-3d;will-change:transform\}\n    \.letter-box\.flip-out\{animation:flipOut \.26s cubic-bezier\(\.55,\.02,\.75,\.32\) both\}\n    \.letter-box\.flip-in\{animation:flipIn \.30s cubic-bezier\(\.16,1,\.3,1\) both\}\n    @keyframes flipOut\{from\{transform:rotateX\(0\)\}to\{transform:rotateX\(-90deg\)\}\}\n    @keyframes flipIn\{from\{transform:rotateX\(90deg\)\}to\{transform:rotateX\(0\)\}\}\n    \.letter-face,\.letter-reflection\{font-family:Impact,"Arial Black","Archivo Black",sans-serif;font-size:clamp\(105px,30vw,160px\);font-weight:900;line-height:1;color:var\(--gold\);text-shadow:0 3px 0 var\(--gold-shadow\),0 8px 30px rgba\(245,179,0,\.24\),0 0 45px rgba\(245,179,0,\.08\)\}\n    \.letter-reflection\{position:absolute;top:78%;left:0;right:0;text-align:center;transform:scaleY\(-\.68\) perspective\(500px\) rotateX\(24deg\);transform-origin:top;opacity:\.18;filter:blur\(2px\) brightness\(\.75\);-webkit-mask-image:linear-gradient\(to bottom,rgba\(0,0,0,\.75\),rgba\(0,0,0,\.15\) 42%,transparent 78%\);mask-image:linear-gradient\(to bottom,rgba\(0,0,0,\.75\),rgba\(0,0,0,\.15\) 42%,transparent 78%\);pointer-events:none\}\n    \.loader-stage::after\{content:"";position:absolute;width:180px;height:30px;top:87%;background:radial-gradient\(ellipse,rgba\(245,179,0,\.14\),transparent 68%\);filter:blur\(7px\)\}''',
                  '''    .loader-stage{position:relative;width:min(52vw,230px);aspect-ratio:1;display:grid;place-items:center}\n    .letter-box{position:relative;width:100%;height:100%;display:grid;place-items:center}\n    .letter-face{font-family:"Anton",Impact,"Arial Narrow","Helvetica Neue Condensed",sans-serif;font-size:clamp(84px,24vw,128px);font-weight:900;line-height:.92;letter-spacing:-.045em;color:var(--gold);text-shadow:none;transform:scaleX(.84);transform-origin:center}\n    .letter-reflection{display:none}\n    .loader-stage::after{display:none}'''
              ),
              (
                  r'''      \.letter-face,\.letter-reflection\{font-size:clamp\(92px,27vw,136px\)\}''',
                  '''      .letter-face{font-size:clamp(74px,21.6vw,109px)}'''
              ),
              (
                  r'''    @media\(prefers-reduced-motion:reduce\)\{\.letter-box\.flip-out,\.letter-box\.flip-in\{animation-duration:\.01ms\}\.story-card\{filter:none!important\}\}''',
                  '''    @media(prefers-reduced-motion:reduce){.story-card{filter:none!important}}'''
              ),
              (
                  r'''      <div class="letter-reflection" id="letter-reflection">D</div>\n''',
                  ''''''
              ),
              (
                  r'''      const letterReflection=document\.getElementById\('letter-reflection'\);\n''',
                  ''''''
              ),
              (
                  r'''      const TOUCH_TRAVEL_SCREENS=3\.6667;\n      const WHEEL_TRAVEL_PX=2667;\n      const KEY_STEP=\.054;''',
                  '''      const TOUCH_TRAVEL_SCREENS=3.0556;\n      const WHEEL_TRAVEL_PX=2222;\n      const KEY_STEP=.0648;'''
              ),
          ]

          for pattern, repl in replacements:
              text2, count = re.subn(pattern, repl, text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement, got {count}: {pattern[:90]}')
              text = text2

          swap_pattern = re.compile(
              r'''      const swapLetter=index=>\{\n.*?\n      \};\n\n      const paintLoader=p=>\{''',
              re.S,
          )
          swap_repl = '''      const swapLetter=index=>{\n        if(index===currentLetterIndex)return;\n        currentLetterIndex=index;\n        currentLetter.textContent=LETTERS[index];\n      };\n\n      const paintLoader=p=>{'''
          text, count = swap_pattern.subn(swap_repl, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one swapLetter replacement, got {count}')

          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'font-size:clamp(84px,24vw,128px)' static/scroll.html
          grep -q 'TOUCH_TRAVEL_SCREENS=3.0556' static/scroll.html
          grep -q 'WHEEL_TRAVEL_PX=2222' static/scroll.html
          ! grep -q 'letter-reflection" id="letter-reflection' static/scroll.html
          ! grep -q 'flipOut' static/scroll.html

      - name: Commit patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/scroll.html
          git commit -m "Flatten preload letters and speed up scrub"
          PATCH_SHA=$(git rev-parse HEAD)
          echo "sha=$PATCH_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:SOL

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/scroll.html
          test -s dist/cinematic/scroll-bg-720.mp4
          grep -q 'font-size:clamp(84px,24vw,128px)' dist/scroll.html
          grep -q 'TOUCH_TRAVEL_SCREENS=3.0556' dist/scroll.html
          grep -q 'DESORDEN_SCROLL_LOCKED_V5_CONSENT' dist/scroll.html

      - name: Deploy Worker webl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy --name webl

      - name: Verify public WEBL scroll
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 20 'https://webl.desorden-help-76b.workers.dev/scroll' -o /tmp/scroll.html; then
              if grep -q 'font-size:clamp(84px,24vw,128px)' /tmp/scroll.html && grep -q 'TOUCH_TRAVEL_SCREENS=3.0556' /tmp/scroll.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'WEBL /scroll did not verify flat loader + faster scrub' >&2
          exit 1

      - name: Record verified release
        shell: bash
        env:
          PATCH_SHA: ${{ steps.patch.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p static/release
          cat > static/release/webl-scroll.txt <<EOF
          STATUS=VERIFIED
          SOURCE_SHA=${PATCH_SHA}
          URL=https://webl.desorden-help-76b.workers.dev/scroll
          MARKER=DESORDEN_SCROLL_LOCKED_V5_CONSENT
          FLOW=flat-gold-loader-80,anton-like,consent-mode-v2,virtual-scroll,no-fullscreen,video-bottom-contain,scrub-144
          EOF
          git add static/release/webl-scroll.txt
          git commit -m 'Record WEBL flat loader release'
          git push origin HEAD:SOL
