name: Apply SEDON Forest Once

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-sedon-forest.mjs
      - .github/workflows/apply-sedon-forest-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic instanced forest
        run: node scripts/apply-sedon-forest.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build -- --base=./

      - name: Commit validated migration and remove one-shot files
        shell: bash
        run: |
          rm -f scripts/apply-sedon-forest.mjs
          rm -f .github/workflows/apply-sedon-forest-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Apply SEDON-inspired instanced forest renderer"
          git push origin HEAD:main
