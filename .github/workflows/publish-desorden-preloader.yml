name: Publish DESORDEN preloader

on:
  push:
    branches:
      - SOL
    paths:
      - .github/workflows/publish-desorden-preloader.yml

permissions:
  contents: write

concurrency:
  group: publish-desorden-preloader
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFY_ROOT: https://sol.desorden-help-76b.workers.dev/
      VERIFY_SCROLL: https://sol.desorden-help-76b.workers.dev/scroll.html

    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Verify embedded loader contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data:video/mp4;base64,' index.html
          grep -q 'FINAL_FRAME=138' index.html
          grep -q 'desorden_cookie_consent' index.html
          grep -q 'cinematic/scroll-bg-720.mp4' index.html
          grep -q 'scroll.html' index.html

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/cinematic/scroll-bg-720.mp4
          test -f dist/scroll.html
          grep -q 'data:video/mp4;base64,' dist/index.html
          grep -q 'desorden_cookie_consent' dist/index.html
          grep -q 'Cinematic Scroll Background' dist/scroll.html

      - name: Deploy SOL Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy

      - name: Verify public preload and scroll
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            ROOT=$(curl -L --fail --silent --show-error "${VERIFY_ROOT}" || true)
            SCROLL=$(curl -L --fail --silent --show-error "${VERIFY_SCROLL}" || true)
            if echo "$ROOT" | grep -q 'desorden_cookie_consent' && echo "$ROOT" | grep -q 'data:video/mp4;base64,' && echo "$SCROLL" | grep -q 'Cinematic Scroll Background'; then
              echo 'Public verification PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'Public verification FAILED'
          exit 1

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/release
          printf '%s\n' \
            'DESORDEN PRELOADER — VERIFIED' \
            'loader_frames=139' \
            'loader_fps=24' \
            'loader_delivery=embedded' \
            'consent_cookie=desorden_cookie_consent' \
            'root=https://sol.desorden-help-76b.workers.dev/' \
            'scroll=https://sol.desorden-help-76b.workers.dev/scroll.html' \
            > static/release/desorden-preloader.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/release/desorden-preloader.txt
          git commit -m 'Verify DESORDEN preloader release'
          git push origin HEAD:SOL
