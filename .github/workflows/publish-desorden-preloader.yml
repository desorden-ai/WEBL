name: Publish DESORDEN preloader

on:
  push:
    branches:
      - SOL
    paths:
      - .github/workflows/publish-desorden-preloader.yml

permissions:
  contents: write

concurrency:
  group: publish-desorden-preloader
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOADER_DRIVE_ID: 1H67yKeWbXKkv70K0CAuM4UE-sW3x4Feb
      EXPECTED_FRAMES: '139'
      EXPECTED_RATE: '24/1'
      VERIFY_ROOT: https://sol.desorden-help-76b.workers.dev/
      VERIFY_SCROLL: https://sol.desorden-help-76b.workers.dev/scroll.html

    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Download DESORDEN loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${LOADER_DRIVE_ID}&export=download&confirm=t" \
            -o static/assets/desorden-loader.mp4

      - name: Verify loader frames
        shell: bash
        run: |
          set -euo pipefail
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames \
            -of default=nk=1:nw=1 static/assets/desorden-loader.mp4)
          RATE=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=r_frame_rate \
            -of default=nk=1:nw=1 static/assets/desorden-loader.mp4)
          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=nk=1:nw=1 static/assets/desorden-loader.mp4)
          echo "frames=${FRAMES} rate=${RATE} duration=${DURATION}"
          test "${FRAMES}" = "${EXPECTED_FRAMES}"
          test "${RATE}" = "${EXPECTED_RATE}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify built preload assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/desorden-loader.mp4
          test -f dist/cinematic/scroll-bg-720.mp4
          test -f dist/scroll.html
          grep -q "desorden_cookie_consent" dist/index.html
          grep -q "desorden-loader.mp4" dist/index.html

      - name: Commit loader asset to SOL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/assets/desorden-loader.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add DESORDEN loader asset"
            git push origin HEAD:SOL
          fi

      - name: Deploy SOL Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy

      - name: Verify public preload and scroll
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            ROOT=$(curl -L --fail --silent --show-error "${VERIFY_ROOT}" || true)
            SCROLL=$(curl -L --fail --silent --show-error "${VERIFY_SCROLL}" || true)
            if echo "$ROOT" | grep -q "desorden_cookie_consent" && echo "$SCROLL" | grep -q "Cinematic Scroll Background"; then
              echo "Public verification PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Public verification FAILED"
          exit 1

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/release
          printf '%s\n' \
            'DESORDEN PRELOADER — VERIFIED' \
            'loader_frames=139' \
            'loader_fps=24' \
            'consent_cookie=desorden_cookie_consent' \
            'root=https://sol.desorden-help-76b.workers.dev/' \
            'scroll=https://sol.desorden-help-76b.workers.dev/scroll.html' \
            > static/release/desorden-preloader.txt
          git add static/release/desorden-preloader.txt
          git commit -m "Verify DESORDEN preloader release"
          git push origin HEAD:SOL
