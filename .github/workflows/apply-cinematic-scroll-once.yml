name: Apply Cinematic Scroll Production Bundle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-cinematic-scroll-once.yml

permissions:
  contents: write

concurrency:
  group: mansion-refugio-cinematic-bootstrap
  cancel-in-progress: false

jobs:
  apply-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLE_ID: 1V__t0VKLmnpkktlIHLSe37edMIHHiy-J
      BUNDLE_SHA256: 9eb6315cc72da51f8222964301969b1342c5e8541649a1cddb316ef5d59c8118
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${BUNDLE_ID}&export=download&confirm=t" \
            -o /tmp/cinematic-scroll.zip
          echo "${BUNDLE_SHA256}  /tmp/cinematic-scroll.zip" | sha256sum -c -
          rm -rf /tmp/cinematic-scroll-bundle
          mkdir -p /tmp/cinematic-scroll-bundle
          unzip -q /tmp/cinematic-scroll.zip -d /tmp/cinematic-scroll-bundle
          BUNDLE_SCRIPT="$(find /tmp/cinematic-scroll-bundle -type f -name apply-to-webl.sh -print -quit)"
          test -n "$BUNDLE_SCRIPT"
          BUNDLE_DIR="$(dirname "$BUNDLE_SCRIPT")"
          cd "$BUNDLE_DIR"
          sha256sum -c CHECKSUMS.sha256
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

      - name: Apply bundle and validate production build
        shell: bash
        run: |
          set -euo pipefail
          bash "$BUNDLE_DIR/apply-to-webl.sh" "$GITHUB_WORKSPACE"

      - name: Commit cinematic integration to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main.tsx \
            src/components/CinematicScroll.tsx \
            src/components/DepthTransition.tsx \
            src/components/Experience.tsx \
            src/hooks/useScrollVideo.ts \
            src/data/cinematicIntro.ts \
            public/cinematic/intro/intro-scroll-720.mp4 \
            public/cinematic/intro/poster-start.webp \
            public/cinematic/intro/poster-end.webp \
            public/cinematic/intro/transition/final-depth.png \
            public/cinematic/intro/transition/layer-background.webp \
            public/cinematic/intro/transition/layer-midground.webp \
            public/cinematic/intro/transition/layer-house.webp \
            public/cinematic/intro/transition/layer-foreground.webp
          if git diff --cached --quiet; then
            echo "No integration changes detected."
          else
            git commit -m "Add cinematic scroll video-to-3D intro"
            git push origin HEAD:main
          fi
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish static preview branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mansion-preview
          mkdir -p /tmp/mansion-preview
          cp -R dist/. /tmp/mansion-preview/
          git checkout --orphan mansion-refugio-3d-static
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/mansion-preview/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish mansion refuge cinematic preview"
          git push --force origin HEAD:mansion-refugio-3d-static

      - name: Deploy Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured; static preview remains available."
            exit 0
          fi
          npx --yes wrangler@latest pages project create mansion-refugio-3d --production-branch=main || true
          npx --yes wrangler@latest pages deploy /tmp/mansion-preview \
            --project-name=mansion-refugio-3d \
            --branch=main \
            --commit-hash="$INTEGRATED_SHA" \
            --commit-dirty=true
