name: Deploy SOL scroll background

on:
  push:
    branches:
      - SOL
    paths:
      - static/scroll.html
      - static/cinematic/**
      - .github/workflows/deploy-sol-scroll.yml

permissions:
  contents: write

concurrency:
  group: deploy-sol-scroll
  cancel-in-progress: true

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify generated scroll files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/scroll.html
          test -s dist/cinematic/scroll-bg-720.mp4
          grep -q "Cinematic Scroll Background" dist/scroll.html
          grep -q "frameCurrent" dist/scroll.html

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy

      - name: Verify public URL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 20 "https://sol.desorden-help-76b.workers.dev/scroll.html" -o /tmp/scroll.html; then
              if grep -q "Cinematic Scroll Background" /tmp/scroll.html && grep -q "frameCurrent" /tmp/scroll.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Published page did not match the new scroll build" >&2
          exit 1

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/release
          cat > static/release/scroll-background.txt <<EOF
          STATUS=VERIFIED
          SOURCE_SHA=${GITHUB_SHA}
          URL=https://sol.desorden-help-76b.workers.dev/scroll.html
          FEATURES=frame-counter,cinematic-damping,darker-grade
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/release/scroll-background.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record verified cinematic scroll release"
            git push origin HEAD:SOL
          fi
