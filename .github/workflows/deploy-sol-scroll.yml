name: Deploy SOL unified DESORDEN flow

on:
  push:
    branches:
      - SOL
    paths:
      - index.html
      - static/face-rebuilt.html
      - static/scroll.html
      - static/assets/desorden-loader.mp4
      - static/cinematic/**
      - worker/**
      - wrangler.jsonc
      - .github/workflows/deploy-sol-scroll.yml

permissions:
  contents: write

concurrency:
  group: deploy-sol-unified-flow
  cancel-in-progress: true

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Validate DESORDEN loader
        shell: bash
        run: |
          set -euo pipefail
          test -s static/assets/desorden-loader.mp4
          FRAMES=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nk=1:nw=1 static/assets/desorden-loader.mp4)
          RATE=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nk=1:nw=1 static/assets/desorden-loader.mp4)
          test "$FRAMES" = "139"
          test "$RATE" = "24/1"

      - name: Build
        run: npm run build

      - name: Verify unified build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/face-rebuilt.html
          test -s dist/scroll.html
          test -s dist/assets/desorden-loader.mp4
          test -s dist/cinematic/scroll-bg-720.mp4
          grep -q "MIN_VISUAL_MS=4700" dist/index.html
          grep -q "desorden_cookie_consent" dist/index.html
          grep -q "desorden-face-complete" dist/index.html
          grep -q "brightness(.90)" dist/scroll.html
          grep -q "panasonic-sat-extractor" worker/index.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy

      - name: Verify public unified flow and SAT API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 20 "https://sol.desorden-help-76b.workers.dev/?reset-consent=1" -o /tmp/root.html; then
              if grep -q "MIN_VISUAL_MS=4700" /tmp/root.html && grep -q "desorden_cookie_consent" /tmp/root.html && grep -q "face-rebuilt.html" /tmp/root.html; then
                curl -fLsS --max-time 20 "https://sol.desorden-help-76b.workers.dev/scroll.html" -o /tmp/scroll.html
                grep -q "brightness(.90)" /tmp/scroll.html
                curl -fLsS --max-time 20 "https://desorden.cat/api/sat/health" -o /tmp/sat-health.json
                grep -q '"ok":true' /tmp/sat-health.json
                grep -q 'panasonic-sat-extractor' /tmp/sat-health.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Unified DESORDEN flow or SAT API did not verify" >&2
          exit 1

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/release
          cat > static/release/desorden-unified-flow.txt <<EOF
          STATUS=VERIFIED
          SOURCE_SHA=${GITHUB_SHA}
          URL=https://sol.desorden-help-76b.workers.dev/
          LOADER=frames-0-138,139-frames,24fps,min-4700ms
          FLOW=cookies,loader,portrait,scroll,single-page
          SCROLL_GRADE=brightness-0.90,reduced-veil-vignette
          SAT_API=https://desorden.cat/api/sat/extract-servicepro
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/release/desorden-unified-flow.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record verified unified DESORDEN flow"
            git push origin HEAD:SOL
          fi
