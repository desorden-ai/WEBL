name: Deploy SOL DESORDEN flow

on:
  push:
    branches:
      - SOL
    paths:
      - index.html
      - static/gate.html
      - static/face-rebuilt.html
      - static/loader-48.js
      - static/scroll.html
      - static/cinematic/**
      - .github/workflows/deploy-sol-scroll.yml

permissions:
  contents: write

concurrency:
  group: deploy-sol-desorden-flow
  cancel-in-progress: true

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify DESORDEN flow files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/gate.html
          test -s dist/face-rebuilt.html
          test -s dist/loader-48.js
          test -s dist/scroll.html
          test -s dist/cinematic/scroll-bg-720.mp4
          grep -q "gate.html" dist/index.html
          grep -q "MIN_VISUAL_MS=4700" dist/gate.html
          grep -q "desorden-face-complete" dist/face-rebuilt.html
          grep -q "Cinematic Scroll Background" dist/scroll.html
          grep -q "frameCurrent" dist/scroll.html

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler deploy

      - name: Verify public flow
        shell: bash
        run: |
          set -euo pipefail
          ROOT=https://sol.desorden-help-76b.workers.dev/
          GATE=https://sol.desorden-help-76b.workers.dev/gate.html
          FACE=https://sol.desorden-help-76b.workers.dev/face-rebuilt.html
          SCROLL=https://sol.desorden-help-76b.workers.dev/scroll.html
          for attempt in 1 2 3 4 5 6; do
            ok=1
            curl -fLsS --max-time 20 "$ROOT" -o /tmp/root.html || ok=0
            curl -fLsS --max-time 20 "$GATE" -o /tmp/gate.html || ok=0
            curl -fLsS --max-time 20 "$FACE" -o /tmp/face.html || ok=0
            curl -fLsS --max-time 20 "$SCROLL" -o /tmp/scroll.html || ok=0
            if [ "$ok" = 1 ] \
              && grep -q "gate.html" /tmp/root.html \
              && grep -q "MIN_VISUAL_MS=4700" /tmp/gate.html \
              && grep -q "desorden-face-complete" /tmp/face.html \
              && grep -q "Cinematic Scroll Background" /tmp/scroll.html; then
              echo "DESORDEN public flow verified"
              exit 0
            fi
            sleep 5
          done
          echo "Published DESORDEN flow did not match the SOL build" >&2
          exit 1

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/release
          cat > static/release/desorden-flow.txt <<EOF
          STATUS=VERIFIED
          SOURCE_SHA=${GITHUB_SHA}
          ROOT=https://sol.desorden-help-76b.workers.dev/
          GATE=https://sol.desorden-help-76b.workers.dev/gate.html
          FACE=https://sol.desorden-help-76b.workers.dev/face-rebuilt.html
          SCROLL=https://sol.desorden-help-76b.workers.dev/scroll.html
          FLOW=loader-0-138,cookie-gate,face-interaction,scroll-64-240
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/release/desorden-flow.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record verified DESORDEN flow release"
            git push origin HEAD:SOL
          fi
