name: Deploy Mansion Refugio 3D

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mansion-refugio-3d-main
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build -- --base=./

      - name: Publish static preview branch
        shell: bash
        run: |
          rm -rf /tmp/mansion-preview
          mkdir -p /tmp/mansion-preview
          cp -R dist/. /tmp/mansion-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan mansion-refugio-3d-static
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/mansion-preview/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish mansion refuge static preview"
          git push --force origin HEAD:mansion-refugio-3d-static

      - name: Deploy Cloudflare Pages when credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured in this repository; static preview remains available."
            exit 0
          fi
          npx --yes wrangler@latest pages project create mansion-refugio-3d --production-branch=main || true
          npx --yes wrangler@latest pages deploy dist \
            --project-name=mansion-refugio-3d \
            --branch=main \
            --commit-hash="$GITHUB_SHA"
