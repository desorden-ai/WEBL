name: Build and publish scroll background

on:
  push:
    branches:
      - SOL
    paths:
      - .github/workflows/build-scroll-background.yml

permissions:
  contents: write

concurrency:
  group: sol-scroll-background
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_DRIVE_ID: 1V__t0VKLmnpkktlIHLSe37edMIHHiy-J
    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Download 4K source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=${SOURCE_DRIVE_ID}&export=download&confirm=t" \
            -o /tmp/scroll-source-4k.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate \
            -of default=nw=1 /tmp/scroll-source-4k.mp4

      - name: Encode seek-friendly 720p asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/cinematic
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/scroll-source-4k.mp4 \
            -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:black" \
            -an \
            -c:v libx264 \
            -preset medium \
            -crf 22 \
            -profile:v high \
            -level 4.0 \
            -pix_fmt yuv420p \
            -g 6 \
            -keyint_min 6 \
            -sc_threshold 0 \
            -movflags +faststart \
            static/cinematic/scroll-bg-720.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=nw=1 static/cinematic/scroll-bg-720.mp4

      - name: Generate scroll page
        shell: bash
        run: |
          set -euo pipefail
          cat > static/scroll.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
            <meta name="theme-color" content="#000000" />
            <title>SOL — Scroll Background</title>
            <style>
              * { box-sizing: border-box; }
              html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
              body { overscroll-behavior-y: none; }
              .scroll-stage { position: relative; height: 600vh; background: #000; }
              .sticky { position: sticky; top: 0; width: 100%; height: 100svh; overflow: hidden; background: #000; }
              video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; background: #000; }
              .veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom,rgba(0,0,0,.08),transparent 30%,transparent 70%,rgba(0,0,0,.18)); }
              .hint { position: absolute; left: 50%; bottom: max(24px,env(safe-area-inset-bottom)); transform: translateX(-50%); color: #fff; font: 600 11px/1 system-ui,sans-serif; letter-spacing: .18em; text-transform: uppercase; opacity: .65; white-space: nowrap; transition: opacity .25s linear; }
              .started .hint { opacity: 0; }
            </style>
          </head>
          <body>
            <section class="scroll-stage" id="stage">
              <div class="sticky" id="sticky">
                <video id="video" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture src="/cinematic/scroll-bg-720.mp4"></video>
                <div class="veil" aria-hidden="true"></div>
                <div class="hint" aria-hidden="true">Desliza</div>
              </div>
            </section>
            <script>
              (() => {
                const stage = document.getElementById('stage');
                const sticky = document.getElementById('sticky');
                const video = document.getElementById('video');
                let duration = 10;
                let targetTime = 0;
                let seeking = false;
                let ready = false;
                let raf = 0;

                const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

                const getProgress = () => {
                  const rect = stage.getBoundingClientRect();
                  const travel = Math.max(1, stage.offsetHeight - window.innerHeight);
                  return clamp(-rect.top / travel, 0, 1);
                };

                const seekLatest = () => {
                  if (!ready || seeking) return;
                  if (Math.abs(video.currentTime - targetTime) < 0.012) return;
                  seeking = true;
                  try {
                    video.currentTime = targetTime;
                  } catch (_) {
                    seeking = false;
                  }
                };

                const update = () => {
                  raf = 0;
                  if (!ready) return;
                  const progress = getProgress();
                  targetTime = progress * Math.max(0, duration - 0.04);
                  sticky.classList.toggle('started', progress > 0.015);
                  seekLatest();
                };

                const schedule = () => {
                  if (!raf) raf = requestAnimationFrame(update);
                };

                video.addEventListener('loadedmetadata', () => {
                  duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 10;
                  ready = true;
                  targetTime = getProgress() * Math.max(0, duration - 0.04);
                  try { video.currentTime = targetTime; } catch (_) {}
                  seekLatest();
                }, { once: true });

                video.addEventListener('seeked', () => {
                  seeking = false;
                  seekLatest();
                });

                const unlock = () => {
                  if (!ready) return;
                  const playPromise = video.play();
                  if (playPromise && playPromise.then) {
                    playPromise.then(() => video.pause()).catch(() => {});
                  }
                };

                addEventListener('scroll', schedule, { passive: true });
                addEventListener('resize', schedule, { passive: true });
                addEventListener('orientationchange', schedule, { passive: true });
                addEventListener('touchstart', unlock, { once: true, passive: true });
                addEventListener('pointerdown', unlock, { once: true, passive: true });
              })();
            </script>
          </body>
          </html>
          HTML

      - name: Validate application build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/scroll.html
          test -s dist/cinematic/scroll-bg-720.mp4

      - name: Commit generated scroll experience to SOL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/scroll.html static/cinematic/scroll-bg-720.mp4
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add scroll-controlled cinematic background"
            git push origin HEAD:SOL
          fi
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deploy SOL Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare secrets are not configured. Push completed; manual deploy skipped."
            exit 0
          fi
          npx wrangler deploy
          sleep 4
          curl -fLsS "https://sol.desorden-help-76b.workers.dev/scroll.html" -o /tmp/scroll-published.html
          grep -q "SOL — Scroll Background" /tmp/scroll-published.html
          echo "Published: https://sol.desorden-help-76b.workers.dev/scroll.html"
