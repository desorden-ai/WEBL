name: Deploy WEBL scroll from SOL

# retrigger: 2026-08-18T22:00+02:00
on:
  push:
    branches:
      - SOL
    paths:
      - static/scroll.html
      - static/cinematic/**
      - static/_redirects
      - wrangler.jsonc
      - wrangler.worker.jsonc
      - .github/workflows/deploy-webl-scroll.yml

permissions:
  contents: write

concurrency:
  group: deploy-webl-scroll
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SOL
        uses: actions/checkout@v4
        with:
          ref: SOL
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify WEBL scroll build
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/scroll.html
          test -s dist/cinematic/scroll-bg-720.mp4
          test -s dist/_redirects
          grep -q "DESORDEN_SCROLL_PRELOADER_V2" dist/scroll.html
          grep -q "DESORDEN_SCROLL_LOCKED_V5_CONSENT" dist/scroll.html
          grep -q "DESORDEN_SCROLL_SECTIONS_V1" dist/scroll.html
          grep -q "DESORDEN STUDIO" dist/scroll.html
          grep -q '<html lang="ca">' dist/scroll.html
          grep -q "Configuració de galetes" dist/scroll.html
          grep -q '<h2>Parlem</h2>' dist/scroll.html
          grep -q '^/ /scroll 200$' dist/_redirects

      - name: Deploy Worker webl
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          # The custom-domain routes already exist. Deploy only the Worker
          # version so the token does not need zone route-management scope.
          npx wrangler deploy --config wrangler.worker.jsonc --name webl

      - name: Verify public WEBL scroll
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 20 "https://webl.desorden-help-76b.workers.dev/scroll" -o /tmp/scroll.html; then
              if grep -q "DESORDEN_SCROLL_LOCKED_V5_CONSENT" /tmp/scroll.html \
                && grep -q "DESORDEN_SCROLL_SECTIONS_V1" /tmp/scroll.html; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "WEBL /scroll did not verify" >&2
          exit 1

      - name: Verify DESORDEN custom domains (best effort)
        shell: bash
        run: |
          set -euo pipefail
          for host in www.desorden.cat desorden.cat; do
            verified=0
            for attempt in 1 2 3; do
              if curl -fLsS --max-time 20 \
                -A "Mozilla/5.0 (compatible; DESORDEN-Deploy-Check/1.0)" \
                "https://${host}/?verify=${GITHUB_SHA}" -o /tmp/domain.html; then
                if grep -q "DESORDEN_SCROLL_LOCKED_V5_CONSENT" /tmp/domain.html \
                  && grep -q "DESORDEN_SCROLL_SECTIONS_V1" /tmp/domain.html \
                  && grep -q '<html lang="ca">' /tmp/domain.html \
                  && grep -q '<h2>Parlem</h2>' /tmp/domain.html; then
                  verified=1
                  break
                fi
              fi
              sleep 5
            done
            if [ "${verified}" -ne 1 ]; then
              echo "::warning::${host} blocked or unavailable from the GitHub runner; Worker deployment and workers.dev verification already passed."
            fi
          done

      - name: Record verified WEBL release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/release
          cat > static/release/webl-scroll.txt <<EOF
          STATUS=VERIFIED
          SOURCE_SHA=${GITHUB_SHA}
          URL=https://desorden.cat/
          WWW_URL=https://www.desorden.cat/
          WORKER_URL=https://webl.desorden-help-76b.workers.dev/scroll
          MARKER=DESORDEN_SCROLL_LOCKED_V5_CONSENT
          FLOW=stream-preload,consent-mode-v2,virtual-scroll,no-fullscreen,video-bottom-contain,scrub-120
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/release/webl-scroll.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record verified WEBL scroll release"
            git push origin HEAD:SOL
          fi
