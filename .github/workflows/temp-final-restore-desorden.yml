name: TEMP Final Restore DESORDEN

on:
  pull_request:
    branches:
      - SOL
    paths:
      - .github/workflows/temp-final-restore-desorden.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pre-SAT DESORDEN commit
        uses: actions/checkout@v4
        with:
          ref: 8081cdb5685f79951aad2adabc01f4e0ac4f1e2b

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pre-SAT DESORDEN assets
        run: npm run build

      - name: Build route-free restore config
        shell: bash
        run: |
          cat > wrangler.restore-final.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "sol",
            "compatibility_date": "2026-07-31",
            "workers_dev": false,
            "assets": { "directory": "./dist" }
          }
          EOF

      - name: Upload pre-SAT Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=$(npx --yes wrangler@4.121.0 deploy --config wrangler.restore-final.jsonc 2>&1)
          printf '%s\n' "$OUTPUT"
          VERSION_ID=$(printf '%s\n' "$OUTPUT" | sed -n 's/.*Current Version ID: //p' | tail -n 1 | tr -d '\r')
          test -n "$VERSION_ID"
          echo "RESTORE_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"

      - name: Promote pre-SAT Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RESTORE_VERSION_ID:-}"
          npx --yes wrangler@4.121.0 versions deploy --config wrangler.restore-final.jsonc --version-id "$RESTORE_VERSION_ID" -y
