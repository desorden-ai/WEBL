<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030303">
  <meta name="description" content="Experiencia inmersiva de scroll 3D con tipografía flotante y campo de estrellas.">
  <title>Experiencia de Scroll 3D</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <noscript>
    <div class="noscript-message">Esta experiencia necesita JavaScript para ejecutarse.</div>
  </noscript>

  <div class="noise-overlay" aria-hidden="true"></div>
  <canvas id="stars-canvas" aria-hidden="true"></canvas>

  <main id="scene" aria-label="Experiencia de recorrido tridimensional">
    <div id="world" aria-hidden="true"></div>
  </main>

  <div id="hud-bottom" aria-live="polite">
    <span>Sección</span>
    <span id="hud-section-name">La década</span>
    <span class="arrow-up" aria-hidden="true">↑</span>
  </div>

  <div class="scroll-hint" aria-hidden="true">
    <span>Desliza</span>
    <span class="scroll-hint__line"></span>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
