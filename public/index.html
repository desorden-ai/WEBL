<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#030303">
  <meta name="description" content="Experiència de scroll 3D adaptatiu amb HUD minimalista per a DESORDEN.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DESORDEN 3D">
  <title>Scroll 3D Adaptatiu — DESORDEN</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#030303;--accent:#F29D26;--white:#fff;--muted:#888;--app-height:100dvh}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{position:fixed;inset:0;width:100%;height:100%;min-height:100svh;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:none;-webkit-overflow-scrolling:auto}
    body{color:var(--white);font-family:'Inter',sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    .noise-overlay{position:fixed;inset:0;width:100vw;height:var(--app-height);pointer-events:none;z-index:50;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    #stars-canvas{position:fixed;inset:0;width:100vw;height:var(--app-height);z-index:1;pointer-events:none}
    #scene{position:fixed;inset:0;width:100vw;height:var(--app-height);z-index:10;perspective:800px;pointer-events:none;display:flex;justify-content:center;align-items:center;overflow:hidden}
    #world{position:absolute;transform-style:preserve-3d;width:0;height:0;will-change:transform}
    .hologram{position:absolute;transform-style:preserve-3d;will-change:transform,opacity,filter;left:50%;top:50%;width:max-content;max-width:90vw}
    .font-bebas{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;line-height:.9}
    .text-orange{color:var(--accent)}.text-white{color:var(--white)}.text-muted{color:var(--muted);font-weight:300}
    .title-huge{font-size:16vw;letter-spacing:1px;text-align:left}.title-section{font-size:14vw;text-align:left}
    .body-text{font-size:1.1rem;line-height:1.6;text-shadow:0 5px 15px rgba(0,0,0,.8)}
    .tall-text-block{font-size:1.3rem;line-height:3;text-align:center;color:#ccc;text-shadow:0 5px 20px #000}.tall-text-block span{color:var(--accent);font-weight:700}
    .subtitle-small{font-size:.9rem;letter-spacing:3px;font-weight:600;text-transform:uppercase}
    .acred-col{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}.acred-icon{font-size:3.5rem;color:var(--accent);font-weight:700;margin-bottom:10px}.acred-text{font-size:.9rem;color:var(--accent)}
    .artist-card{border:1px solid var(--accent);border-radius:20px;padding:20px;display:flex;align-items:center;gap:15px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);width:85vw;position:relative}
    .avatar{width:60px;height:60px;border-radius:50%;background:#222;display:flex;justify-content:center;align-items:center;font-size:.6rem;color:#aaa;flex-shrink:0;border:1px solid #444;overflow:hidden;text-align:center;padding:5px}
    .artist-info{flex-grow:1;text-align:left}.artist-name{font-size:1.8rem;display:flex;align-items:center;gap:8px}.verified-badge{width:16px;height:16px;background:#1DA1F2;border-radius:50%;display:inline-flex;justify-content:center;align-items:center}.card-arrow{width:30px;height:30px;border:1px solid var(--accent);border-radius:50%;display:flex;justify-content:center;align-items:center;color:var(--accent)}
    .input-group{border:1px solid var(--accent);border-radius:12px;padding:15px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.92);width:85vw;backdrop-filter:blur(5px)}.input-group.textarea{align-items:flex-start;height:100px}.input-icon{color:var(--accent);width:20px;flex-shrink:0}
    .btn-primary{border:1px solid var(--accent);color:var(--accent);padding:15px;border-radius:12px;font-size:1.2rem;letter-spacing:2px;display:flex;justify-content:center;align-items:center;gap:10px;width:85vw;background:rgba(0,0,0,.92)}
    .btn-row{display:flex;gap:10px;width:85vw}.btn-half{flex:1;font-size:.9rem;padding:12px 5px;border:1px solid var(--accent);color:var(--accent);border-radius:12px;display:flex;justify-content:center;align-items:center;gap:5px;background:rgba(0,0,0,.92)}
    #hud-top-right{position:fixed;top:max(24px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));z-index:100;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;display:flex;gap:6px}
    #nav-right{position:fixed;right:max(18px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:100;height:35vh}.nav-track{position:relative;width:1px;height:100%;background:rgba(255,255,255,.4)}.nav-thumb{position:absolute;width:3px;height:20%;background:var(--accent);left:-1px;top:0;box-shadow:0 0 10px rgba(242,157,38,.9);will-change:top}
    #hud-bottom-left{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:max(20px,env(safe-area-inset-left));z-index:100;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:#888;display:flex;align-items:center;gap:12px}
    #hud-section-name{color:var(--accent);font-weight:600;transition:opacity .25s ease}.arrow-up{display:inline-block;animation:bounce 2s infinite;font-weight:700;font-size:1.1rem;color:#fff}
    #install-button{position:fixed;left:max(20px,env(safe-area-inset-left));top:max(20px,env(safe-area-inset-top));z-index:110;border:1px solid rgba(242,157,38,.65);border-radius:999px;background:rgba(3,3,3,.78);color:var(--accent);font:600 .65rem/1 'Inter',sans-serif;letter-spacing:1.5px;padding:10px 12px;display:none;backdrop-filter:blur(10px)}
    @keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}60%{transform:translateY(-3px)}}
    svg{width:100%;height:100%}
    @media(min-width:768px){.title-huge{font-size:8rem}.title-section{font-size:7rem}.artist-card,.input-group,.btn-primary,.btn-row{width:min(560px,70vw)}}
    @media(prefers-reduced-motion:reduce){.arrow-up{animation:none}}
  </style>
</head>
<body>
  <button id="install-button" type="button">INSTAL·LAR APP</button>
  <div class="noise-overlay" aria-hidden="true"></div>
  <canvas id="stars-canvas" aria-hidden="true"></canvas>
  <div id="hud-top-right"><span id="current-page" class="text-orange">01</span><span>/</span><span>06</span></div>
  <div id="nav-right" aria-hidden="true"><div class="nav-track"><div class="nav-thumb" id="nav-thumb"></div></div></div>
  <div id="hud-bottom-left"><span style="color:white">SECCIÓ</span><span id="hud-section-name">INTRODUCCIÓ</span><span class="arrow-up">^</span></div>
  <main id="scene" aria-label="Experiència de scroll tridimensional"><div id="world"></div></main>
  <script>
  (()=>{"use strict";
    const sceneData=[
      {id:'s1_1',html:'<h1 class="font-bebas text-white title-huge">EL TEU</h1>',x:-3,y:-15,z:-700},
      {id:'s1_2',html:'<h1 class="font-bebas text-orange title-huge">PARTNER</h1>',x:2,y:5,z:-3500},
      {id:'s1_3',html:'<p class="body-text text-muted" style="font-size:.9rem;letter-spacing:2px">( TECNOLÒGIC I CREATIU )</p>',x:0,y:25,z:-4500},
      {id:'s2_1',html:'<h2 class="font-bebas text-orange title-section">QUI SOC</h2>',x:-5,y:-25,z:-8400},
      {id:'s2_2',html:'<p class="body-text text-muted">David Milla, creador i director<br>de <span class="text-orange">DESORDEN.</span></p>',x:2,y:-5,z:-9800},
      {id:'s2_3',html:'<p class="body-text text-muted">Direcció visual, vídeo,<br>fotografia, dron, IA i web.</p>',x:-2,y:15,z:-11200},
      {id:'s2_4',html:'<p class="body-text text-muted">Un <span class="text-orange">únic interlocutor</span><br>durant tot el procés.</p>',x:4,y:35,z:-12600},
      {id:'s3_1',html:'<div class="font-bebas text-orange subtitle-small" style="border-bottom:1px solid #555;padding-bottom:10px">FORMACIONS | ACREDITACIONS</div>',x:0,y:-20,z:-15400},
      {id:'s3_2',html:'<div class="acred-col"><div class="acred-icon">G</div><div class="acred-text">Fundamentals of<br>Digital Marketing Certification</div></div>',x:-4,y:5,z:-17500},
      {id:'s3_3',html:'<div class="acred-col"><div class="acred-icon" style="display:flex;align-items:center;justify-content:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:35px;height:35px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path></svg><span class="font-bebas" style="font-size:2.5rem">AESA</span></div><div class="acred-text">Certificació oficial de<br>pilot de dron (AESA)</div></div>',x:4,y:30,z:-19600},
      {id:'s4_1',html:'<div class="artist-card"><div class="avatar">[Imatge de Rosalía]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">ROSALÍA <div class="verified-badge"><svg viewBox="0 0 24 24" fill="white" style="width:10px;height:10px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div></div><div class="card-arrow">→</div></div>',x:-4,y:-25,z:-22400},
      {id:'s4_2',html:'<div class="artist-card"><div class="avatar">[Imatge de Rozalén]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">ROZALÉN <div class="verified-badge"><svg viewBox="0 0 24 24" fill="white" style="width:10px;height:10px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div><div style="color:var(--accent);font-size:1.2rem;margin-top:5px">💬 ♡ @</div></div><div class="card-arrow">→</div></div>',x:5,y:0,z:-24500},
      {id:'s4_3',html:'<div class="artist-card"><div class="avatar">[Imatge de Leire]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">LEIRE MARTÍNEZ <div class="verified-badge"><svg viewBox="0 0 24 24" fill="white" style="width:10px;height:10px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div><div style="color:var(--accent);margin-top:5px">···|·|||··|·|·||····</div></div><div class="card-arrow">→</div></div>',x:-3,y:25,z:-26600},
      {id:'s5_1',html:'<h2 class="font-bebas text-orange title-section" style="line-height:.9">PARLEM DEL<br>TEU PROJECTE</h2>',x:-5,y:-30,z:-29400},
      {id:'s5_2',html:'<p class="body-text text-white">Fem visible allò que tens al cap.</p>',x:4,y:-10,z:-30380},
      {id:'s5_3',html:'<div class="input-group"><div class="input-icon">👤</div><div style="color:#ddd">Nom</div></div>',x:-2,y:5,z:-31360},
      {id:'s5_4',html:'<div class="input-group"><div class="input-icon">📞</div><div style="color:#ddd">Contacte</div></div>',x:2,y:15,z:-32340},
      {id:'s5_5',html:'<div class="input-group textarea"><div class="input-icon">🎯</div><div style="color:#ddd">Objectiu</div></div>',x:-2,y:28,z:-33320},
      {id:'s5_6',html:'<div class="btn-primary font-bebas">PARLEM <span style="font-family:sans-serif">→</span></div>',x:2,y:43,z:-34300},
      {id:'s5_7',html:'<div class="btn-row"><div class="btn-half font-bebas"><span style="font-family:sans-serif">💬</span> WHATSAPP</div><div class="btn-half font-bebas"><span style="font-family:sans-serif">✉</span> CORREU</div></div>',x:0,y:55,z:-35280},
      {id:'s6_1',html:'<h2 class="font-bebas text-white title-section" style="text-align:center">MANIFEST</h2>',x:0,y:-35,z:-38500},
      {id:'s6_2',html:'<div class="tall-text-block">No seguimos reglas.<br><span>Desafiamos</span> la gravedad digital.<br>Creamos espacios donde tu<br>marca <span>respira</span> libremente.<br>Donde cada píxel cuenta<br>una historia profunda.<br>Y cada <span>scroll</span> es<br>un viaje sin fin.</div>',x:0,y:10,z:-40000}
    ];

    const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
    const world=document.getElementById('world'),scene=document.getElementById('scene'),thumb=document.getElementById('nav-thumb'),page=document.getElementById('current-page'),label=document.getElementById('hud-section-name');
    const nodes=sceneData.map(data=>{const el=document.createElement('div');el.className='hologram';el.innerHTML=data.html;world.appendChild(el);return{el,data}});
    const travel=Math.abs(Math.min(...sceneData.map(i=>i.z)))+2000;
    const sectionNames=['INTRODUCCIÓ','QUI SOC','FORMACIONS','ARTISTES','PROJECTE','MANIFEST'];
    let target=0,current=0,virtualMax=Math.max(innerHeight*42,24000),active=1,labelTimer=0,panX=0,panY=0,lastPointerY=0,dragging=false;

    const setAppHeight=()=>{document.documentElement.style.setProperty('--app-height',`${window.visualViewport?.height||innerHeight}px`);virtualMax=Math.max((window.visualViewport?.height||innerHeight)*42,24000)};
    setAppHeight();
    visualViewport?.addEventListener('resize',setAppHeight,{passive:true});
    addEventListener('resize',setAppHeight,{passive:true});

    const moveBy=delta=>{target=clamp(target+delta,0,virtualMax)};
    addEventListener('wheel',e=>{e.preventDefault();moveBy(e.deltaY*.9)},{passive:false});
    addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=true;lastPointerY=e.clientY;document.body.setPointerCapture?.(e.pointerId)},{passive:true});
    addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();const dy=lastPointerY-e.clientY;lastPointerY=e.clientY;moveBy(dy*1.35)},{passive:false});
    const stopDrag=()=>{dragging=false};addEventListener('pointerup',stopDrag,{passive:true});addEventListener('pointercancel',stopDrag,{passive:true});
    addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    addEventListener('keydown',e=>{const step=innerHeight*.9;if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();moveBy(step)}else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();moveBy(-step)}else if(e.key==='Home'){target=0}else if(e.key==='End'){target=virtualMax}});

    let fullscreenAttempted=false;
    addEventListener('pointerup',async()=>{if(fullscreenAttempted||matchMedia('(display-mode:standalone)').matches||navigator.standalone)return;fullscreenAttempted=true;try{await document.documentElement.requestFullscreen?.({navigationUI:'hide'})}catch{}},{once:true});

    function frame(){
      current+=(target-current)*.075;
      const progress=clamp(current/virtualMax,0,1),cameraZ=progress*travel,t=Math.pow(progress,1.2);
      panX=Math.sin(t*Math.PI*1.3)*15;panY=Math.sin(progress*Math.PI*2)*5;
      scene.style.perspectiveOrigin=`${50+panX}% ${50+panY}%`;
      world.style.transform=`rotateX(${Math.sin(progress*Math.PI*2)*2}deg) rotateY(${-Math.cos(t*Math.PI*1.3)*3}deg)`;
      thumb.style.top=`${progress*80}%`;
      const next=Math.min(6,Math.floor(progress*6)+1);
      if(next!==active){active=next;page.textContent=String(active).padStart(2,'0');label.style.opacity='0';clearTimeout(labelTimer);labelTimer=setTimeout(()=>{label.textContent=sectionNames[active-1];label.style.opacity='1'},120)}
      const cx=innerWidth/100,cy=(visualViewport?.height||innerHeight)/100;
      for(const {el,data} of nodes){const z=data.z+cameraZ;let opacity=1,blur=0;if(z>500)opacity=0;else if(z>350)opacity=(500-z)/150;else if(z<-15000)blur=(-15000-z)/1000;opacity=clamp(opacity,0,1);blur=clamp(blur,0,20);if(opacity>.01){el.style.display='block';el.style.opacity=opacity;el.style.filter=blur>.1?`blur(${blur}px)`:'none';el.style.transform=`translate(-50%,-50%) translate3d(${data.x*cx}px,${data.y*cy}px,${z}px)`}else el.style.display='none'}
      requestAnimationFrame(frame);
    }

    const canvas=document.getElementById('stars-canvas'),ctx=canvas.getContext('2d');let width=0,height=0,stars=[],lastCurrent=0;
    function initStars(){const dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=visualViewport?.height||innerHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=`${width}px`;canvas.style.height=`${height}px`;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:250},()=>({x:(Math.random()-.5)*width*3,y:(Math.random()-.5)*height*3,z:Math.random()*2000,r:Math.random()*1.5}))}
    function starsFrame(){ctx.clearRect(0,0,width,height);const speed=.5+Math.abs(current-lastCurrent)*.4;lastCurrent=current;const centerX=width/2+(panX/15)*(width*.15),centerY=height/2+(panY/5)*(height*.05);ctx.fillStyle='rgba(242,157,38,1)';for(const s of stars){s.z-=speed;if(s.z<=0){s.x=(Math.random()-.5)*width*3;s.y=(Math.random()-.5)*height*3;s.z=2000}const k=800/s.z,px=s.x*k+centerX,py=s.y*k+centerY;if(px>=0&&px<=width&&py>=0&&py<=height){ctx.beginPath();ctx.arc(px,py,Math.max(.1,s.r*k),0,Math.PI*2);ctx.fill()}}requestAnimationFrame(starsFrame)}
    addEventListener('resize',initStars,{passive:true});visualViewport?.addEventListener('resize',initStars,{passive:true});

    let installPrompt=null;const installButton=document.getElementById('install-button');
    addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installButton.style.display='block'});
    installButton.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.style.display='none'});
    addEventListener('appinstalled',()=>{installButton.style.display='none'});
    if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

    initStars();frame();starsFrame();
  })();
  </script>
</body>
</html>
