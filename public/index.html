<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scroll 3D Móvil - Portada Polvo Estelar Oscuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg-color:#030303;--accent-color:#F29D26;--text-main:#fff;--text-muted:#888}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-color);overscroll-behavior:none}
    body{height:100dvh;width:100vw;background-color:var(--bg-color);color:var(--text-main);font-family:'Inter',sans-serif;overflow:hidden;touch-action:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    #loader{position:fixed;inset:0;width:100vw;height:100dvh;background:var(--bg-color);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .8s ease}
    .spinner{width:40px;height:40px;border:3px solid rgba(242,157,38,.3);border-top-color:var(--accent-color);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-text{font-family:'Bebas Neue',cursive;color:var(--accent-color);font-size:1.5rem;letter-spacing:3px}
    .noise-overlay{position:fixed;inset:0;width:100vw;height:100dvh;pointer-events:none;z-index:50;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")}
    #scene{position:fixed;inset:0;width:100vw;height:100dvh;z-index:10;perspective:900px;pointer-events:none;display:flex;justify-content:center;align-items:center;overflow:hidden}
    #world{position:absolute;transform-style:preserve-3d;width:0;height:0;will-change:transform}
    .hologram{position:absolute;transform-style:preserve-3d;will-change:transform,opacity,filter;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:90vw;opacity:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:center}
    .stardust-container{position:relative;width:85vw;max-width:450px;display:inline-block}
    .stardust-real-img{position:relative;width:100%;height:auto;display:block;image-rendering:high-quality;z-index:1;-webkit-user-drag:none}
    .stardust-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
    .stardust-overlay{position:absolute;inset:0;background:linear-gradient(to left,var(--bg-color) 0%,transparent 25%),linear-gradient(to top,var(--bg-color) 0%,transparent 20%);pointer-events:none;z-index:3}
    .font-bebas{font-family:'Bebas Neue',cursive;text-transform:uppercase;line-height:.9}.text-orange{color:var(--accent-color)}.text-white{color:var(--text-main)}.text-muted{color:var(--text-muted);font-weight:300}
    .title-huge{font-size:18vw;letter-spacing:1px;text-align:left}.title-section{font-size:15vw;text-align:left}.body-text{font-size:1.1rem;line-height:1.6;text-shadow:0 5px 15px rgba(0,0,0,.8)}
    .tall-text-block{font-size:1.3rem;line-height:3;text-align:center;color:#ccc;text-shadow:0 5px 20px #000}.tall-text-block span{color:var(--accent-color);font-weight:700}.subtitle-small{font-size:.9rem;letter-spacing:3px;font-weight:600;text-transform:uppercase}
    .acred-col{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}.acred-icon{font-size:3.5rem;color:var(--accent-color);font-weight:700;margin-bottom:10px}.acred-text{font-size:.9rem;color:var(--accent-color)}
    .artist-card{border:1px solid rgba(242,157,38,.8);border-radius:20px;padding:20px;display:flex;align-items:center;gap:15px;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);width:85vw;position:relative}.avatar{width:60px;height:60px;border-radius:50%;background:#222;display:flex;justify-content:center;align-items:center;font-size:.6rem;color:#aaa;flex-shrink:0;border:1px solid #444;overflow:hidden}.artist-info{flex-grow:1;text-align:left}.artist-name{font-size:1.8rem;display:flex;align-items:center;gap:8px}.verified-badge{width:16px;height:16px;background:#1DA1F2;border-radius:50%;display:inline-flex;justify-content:center;align-items:center}.card-arrow{width:30px;height:30px;border:1px solid var(--accent-color);border-radius:50%;display:flex;justify-content:center;align-items:center;color:var(--accent-color);font-size:1rem}
    .input-group{border:1px solid var(--accent-color);border-radius:12px;padding:15px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.9);width:85vw;backdrop-filter:blur(5px)}.input-group.textarea{align-items:flex-start;height:100px}.input-icon{color:var(--accent-color);width:20px;flex-shrink:0}.btn-primary{border:1px solid var(--accent-color);color:var(--accent-color);padding:15px;border-radius:12px;font-size:1.2rem;letter-spacing:2px;display:flex;justify-content:center;align-items:center;gap:10px;width:85vw;background:rgba(0,0,0,.9)}.btn-row{display:flex;gap:10px;width:85vw}.btn-half{flex:1;font-size:.9rem;padding:12px 5px;border:1px solid var(--accent-color);color:var(--accent-color);border-radius:12px;display:flex;justify-content:center;align-items:center;gap:5px;background:rgba(0,0,0,.9)}
    #hud-top-right{position:fixed;top:40px;right:25px;z-index:100;font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;display:flex;gap:6px}#nav-right{position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;align-items:center;z-index:100;height:35vh}.nav-track{position:relative;width:1px;height:100%;background:rgba(255,255,255,.4)}.nav-thumb{position:absolute;width:3px;height:20%;background:var(--accent-color);left:-1px;top:0;box-shadow:0 0 10px rgba(242,157,38,.9);will-change:top;transition:top .1s linear}#hud-bottom-left{position:fixed;bottom:30px;left:20px;z-index:100;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:#888;display:flex;align-items:center;gap:12px}#hud-section-name{color:var(--accent-color);font-weight:600;transition:opacity .3s ease}.arrow-up{display:inline-block;animation:bounce 2s infinite;font-weight:700;font-size:1.1rem;color:#fff}@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}60%{transform:translateY(-3px)}}
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div><div class="loader-text">CARGANDO EXPERIENCIA</div></div>
  <div class="noise-overlay"></div>
  <div id="hud-top-right"><span id="current-page" class="text-orange">01</span><span style="color:#fff">/</span><span style="color:#fff">07</span></div>
  <div id="nav-right"><div class="nav-track"><div class="nav-thumb" id="nav-thumb"></div></div></div>
  <div id="hud-bottom-left"><span style="color:white">SECCIÓN</span><span id="hud-section-name">INICIO</span><span class="arrow-up">^</span></div>
  <div id="scene"><div id="world"></div></div>
  <script>
    class StardustImage{
      constructor(src,container){this.container=container;this.loaded=false;this.fallbackMode=false;this.fallbackRequested=false;this.realImg=document.createElement('img');this.realImg.className='stardust-real-img';this.realImg.onerror=()=>this.loadFallback();this.realImg.src=src;this.canvas=document.createElement('canvas');this.canvas.className='stardust-canvas';this.ctx=this.canvas.getContext('2d',{alpha:true});this.overlay=document.createElement('div');this.overlay.className='stardust-overlay';container.append(this.realImg,this.canvas,this.overlay);this.particles=[];this.pixelImg=new Image();this.pixelImg.crossOrigin='Anonymous';this.pixelImg.onload=()=>this.processImage(this.pixelImg);this.pixelImg.onerror=()=>this.loadFallback();this.pixelImg.src=src}
      async loadFallback(){if(this.fallbackRequested)return;this.fallbackRequested=true;try{const parts=await Promise.all([0,1,2,3,4].map(i=>fetch(`portrait-${i}.b64`).then(r=>{if(!r.ok)throw new Error('portrait');return r.text()})));const data=`data:image/jpeg;base64,${parts.join('')}`;this.realImg.src=data;this.pixelImg.src=data}catch{this.fallbackMode=true;this.loaded=true;checkLoadingState()}}
      processImage(img){try{const cols=70,aspect=img.height/img.width,rows=Math.floor(cols*aspect),pixelSize=4;this.canvas.width=cols*pixelSize;this.canvas.height=rows*pixelSize;const tempCanvas=document.createElement('canvas');tempCanvas.width=cols;tempCanvas.height=rows;const tCtx=tempCanvas.getContext('2d');tCtx.drawImage(img,0,0,cols,rows);const imgData=tCtx.getImageData(0,0,cols,rows).data;for(let y=0;y<rows;y++){for(let x=0;x<cols;x++){const i=(y*cols+x)*4,r=imgData[i],g=imgData[i+1],b=imgData[i+2],a=imgData[i+3],brightness=(r+g+b)/3;if(a>50&&brightness>15)this.particles.push({baseX:x*pixelSize,baseY:y*pixelSize,color:`rgba(${r},${g},${b},1)`,randX:(Math.random()-.5)*innerWidth*1.5,randY:(Math.random()-.5)*innerHeight*1.5})}}this.loaded=true;checkLoadingState()}catch{this.fallbackMode=true;this.loaded=true;checkLoadingState()}}
      update(zAbsoluta){if(!this.loaded)return;let dispersion=0;if(zAbsoluta>-150)dispersion=(zAbsoluta+150)/1200;dispersion=Math.max(0,Math.min(1,dispersion));const easeDispersion=Math.pow(dispersion,1.2);if(this.fallbackMode){this.realImg.style.opacity=1-easeDispersion;return}this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);if(easeDispersion===0){this.realImg.style.opacity=1;this.canvas.style.opacity=0}else if(easeDispersion<.1){const fade=easeDispersion/.1;this.realImg.style.opacity=1-fade;this.canvas.style.opacity=fade}else{this.realImg.style.opacity=0;this.canvas.style.opacity=1-easeDispersion*.8}if(easeDispersion>=.99)return;for(const p of this.particles){const x=p.baseX+p.randX*easeDispersion,y=p.baseY+p.randY*easeDispersion;this.ctx.fillStyle=p.color;this.ctx.fillRect(x,y,3,3)}}
    }
    const check=`<svg viewBox="0 0 24 24" fill="white" style="width:10px;height:10px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
    const sceneData=[
      {id:'s0_img',type:'stardust',src:'1000091876.jpg',x:0,y:-5,z:-200},
      {id:'s1_1',html:'<h1 class="font-bebas text-white title-huge">TU</h1>',x:-3,y:-15,z:-2500},
      {id:'s1_2',html:'<h1 class="font-bebas text-orange title-huge">PARTNER</h1>',x:2,y:5,z:-4000},
      {id:'s1_3',html:'<p class="body-text text-muted" style="font-size:.9rem;letter-spacing:2px">( TECNOLÓGICO Y CREATIVO )</p>',x:0,y:25,z:-5500},
      {id:'s2_1',html:'<h2 class="font-bebas text-orange title-section">QUIÉN SOY</h2>',x:-5,y:-25,z:-10500},
      {id:'s2_2',html:'<p class="body-text text-muted">David Milla, creador y director<br>de <span class="text-orange">DESORDEN.</span></p>',x:2,y:-5,z:-12500},
      {id:'s2_3',html:'<p class="body-text text-muted">Dirección visual, vídeo,<br>fotografía, dron, IA y web.</p>',x:-2,y:15,z:-14500},
      {id:'s2_4',html:'<p class="body-text text-muted">Un <span class="text-orange">único interlocutor</span><br>durante todo el proceso.</p>',x:4,y:35,z:-16500},
      {id:'s3_1',html:'<div class="font-bebas text-orange subtitle-small" style="border-bottom:1px solid #555;padding-bottom:10px">FORMACIONES | ACREDITACIONES</div>',x:0,y:-20,z:-21000},
      {id:'s3_2',html:'<div class="acred-col"><div class="acred-icon">G</div><div class="acred-text">Fundamentals of<br>Digital Marketing Certification</div></div>',x:-4,y:5,z:-23000},
      {id:'s3_3',html:'<div class="acred-col"><div class="acred-icon" style="display:flex;align-items:center;justify-content:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:35px;height:35px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path></svg><span class="font-bebas" style="font-size:2.5rem">AESA</span></div><div class="acred-text">Certificación oficial de<br>piloto de dron (AESA)</div></div>',x:4,y:30,z:-25000},
      {id:'s4_1',html:`<div class="artist-card"><div class="avatar">[Rosalía]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">ROSALÍA <div class="verified-badge">${check}</div></div></div><div class="card-arrow">→</div></div>`,x:-4,y:-25,z:-30000},
      {id:'s4_2',html:`<div class="artist-card"><div class="avatar">[Rozalén]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">ROZALÉN <div class="verified-badge">${check}</div></div><div style="color:var(--accent-color);font-size:1.2rem;margin-top:5px">💬 ♡ @</div></div><div class="card-arrow">→</div></div>`,x:5,y:0,z:-32000},
      {id:'s4_3',html:`<div class="artist-card"><div class="avatar">[Leire]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">LEIRE MARTÍNEZ <div class="verified-badge">${check}</div></div><div style="color:var(--accent-color);margin-top:5px">···|·|||··|·|·||····</div></div><div class="card-arrow">→</div></div>`,x:-3,y:25,z:-34000},
      {id:'s5_1',html:'<h2 class="font-bebas text-orange title-section" style="line-height:.9">HABLEMOS DE TU<br>PROYECTO</h2>',x:-5,y:-30,z:-39000},
      {id:'s5_2',html:'<p class="body-text text-white">Hacemos visible lo que tienes en mente.</p>',x:4,y:-10,z:-41000},
      {id:'s5_3',html:'<div class="input-group"><div class="input-icon">👤</div><div style="color:#ddd">Nombre</div></div>',x:-2,y:5,z:-43000},
      {id:'s5_4',html:'<div class="input-group"><div class="input-icon">📞</div><div style="color:#ddd">Contacto</div></div>',x:2,y:15,z:-45000},
      {id:'s5_5',html:'<div class="input-group textarea"><div class="input-icon">🎯</div><div style="color:#ddd">Objetivo</div></div>',x:-2,y:28,z:-47000},
      {id:'s5_6',html:'<div class="btn-primary font-bebas">HABLEMOS <span style="font-family:sans-serif">→</span></div>',x:2,y:43,z:-49000},
      {id:'s5_7',html:'<div class="btn-row"><div class="btn-half font-bebas"><span style="font-family:sans-serif">💬</span> WHATSAPP</div><div class="btn-half font-bebas"><span style="font-family:sans-serif">✉</span> CORREO</div></div>',x:0,y:55,z:-51000},
      {id:'s6_1',html:'<h2 class="font-bebas text-white title-section" style="text-align:center">MANIFIESTO</h2>',x:0,y:-35,z:-56000},
      {id:'s6_2',html:'<div class="tall-text-block">No seguimos reglas.<br><span>Desafiamos</span> la gravedad digital.<br>Creamos espacios donde tu<br>marca <span>respira</span> libremente.<br>Donde cada píxel cuenta<br>una historia profunda.<br>Y cada <span>scroll</span> es<br>un viaje sin fin.</div>',x:0,y:10,z:-58000}
    ];
    const worldEl=document.getElementById('world'),sceneEl=document.getElementById('scene'),navThumb=document.getElementById('nav-thumb'),currentPageEl=document.getElementById('current-page'),sectionNameEl=document.getElementById('hud-section-name'),loader=document.getElementById('loader');
    const domElements=[];sceneData.forEach(item=>{const el=document.createElement('div');if(item.type==='stardust'){el.className='hologram stardust-container';worldEl.appendChild(el);domElements.push({element:el,data:item,stardust:new StardustImage(item.src,el)})}else{el.className='hologram';el.innerHTML=item.html;worldEl.appendChild(el);domElements.push({element:el,data:item})}});
    let assetsLoaded=false,sceneStarted=false;
    function checkLoadingState(){assetsLoaded=true;hideLoader()}
    function hideLoader(){if(!assetsLoaded||sceneStarted)return;sceneStarted=true;loader.style.opacity='0';setTimeout(()=>{loader.style.display='none';updateScene()},800)}
    const minZ=Math.min(...sceneData.map(item=>item.z)),requiredCameraTravel=Math.abs(minZ)+5000,maxVirtualScroll=25000,lerpFactor=.12;
    let currentScroll=0,targetScroll=0,globalPanX=0,globalPanY=0,touchStartY=0;
    const sectionNames=['INICIO','INTRODUCCIÓN','QUIÉN SOY','FORMACIONES','ARTISTAS','PROYECTO','MANIFIESTO'];
    addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:false});
    addEventListener('touchmove',e=>{e.preventDefault();const touchY=e.touches[0].clientY;targetScroll+=((touchStartY-touchY)*4.5);targetScroll=Math.max(0,Math.min(targetScroll,maxVirtualScroll));touchStartY=touchY},{passive:false});
    addEventListener('wheel',e=>{e.preventDefault();targetScroll+=e.deltaY*2;targetScroll=Math.max(0,Math.min(targetScroll,maxVirtualScroll))},{passive:false});
    function updateScene(){currentScroll+=(targetScroll-currentScroll)*lerpFactor;const scrollProgress=currentScroll/maxVirtualScroll,cameraZ=scrollProgress*requiredCameraTravel,t=Math.min(1,Math.max(0,cameraZ/requiredCameraTravel)),adjustedT=Math.pow(t,1.2);globalPanX=Math.sin(adjustedT*Math.PI*1.5)*12;globalPanY=Math.sin(t*Math.PI*2.5)*4;sceneEl.style.perspectiveOrigin=`${50+globalPanX}% ${50+globalPanY}%`;worldEl.style.transform=`rotateX(${Math.sin(t*Math.PI*2.5)*1.5}deg) rotateY(${-Math.cos(adjustedT*Math.PI*1.5)*2}deg)`;const cx=innerWidth/100,cy=innerHeight/100;navThumb.style.top=`${scrollProgress*80}%`;let activePage=1;if(scrollProgress<.05)activePage=1;else if(scrollProgress<.18)activePage=2;else if(scrollProgress<.35)activePage=3;else if(scrollProgress<.5)activePage=4;else if(scrollProgress<.65)activePage=5;else if(scrollProgress<.82)activePage=6;else activePage=7;const formatted=String(activePage).padStart(2,'0');if(currentPageEl.innerText!==formatted){currentPageEl.innerText=formatted;sectionNameEl.style.opacity=0;setTimeout(()=>{sectionNameEl.innerText=sectionNames[activePage-1];sectionNameEl.style.opacity=1},150)}domElements.forEach(item=>{const z=item.data.z+cameraZ;if(item.data.type==='stardust'){item.element.style.display='inline-block';item.stardust.update(z);item.element.style.transform=`translate(-50%,-50%) translate3d(${item.data.x*cx}px,${item.data.y*cy}px,${z}px)`;item.element.style.opacity=1;item.element.style.filter='none'}else{const distance=Math.abs(z+600),core=1200,transition=3500;let opacity=distance>core?1-((distance-core)/transition):1;opacity=Math.max(0,Math.min(1,opacity));const blur=(1-opacity)*10;if(opacity>.01){item.element.style.transform=`translate(-50%,-50%) translate3d(${item.data.x*cx}px,${item.data.y*cy}px,${z}px)`;item.element.style.opacity=opacity;item.element.style.filter=`blur(${blur}px)`;item.element.style.display='block'}else item.element.style.display='none'}});requestAnimationFrame(updateScene)}
    addEventListener('load',()=>setTimeout(checkLoadingState,3000),{once:true});
  </script>
</body>
</html>
