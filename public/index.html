  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="preload" href="./assets/module-1-bg-rotating.png" as="image" type="image/png" />
  <link rel="preload" href="./assets/module-1-subject.png" as="image" type="image/png" />
  <link rel="stylesheet" href="./styles.css?v=20260731-desorden" />

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
</head>
<body id="top">
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader__meta"><span>CARREGANT</span><span id="loader-progress">0%</span></div>
    <div class="loader__line" aria-hidden="true"><span id="loader-bar"></span></div>
  </div>

  <aside class="rail" aria-label="Estat de navegació">
    <span class="rail__dot" aria-hidden="true"></span>
    <div class="rail__mode"><strong>VIDEO</strong><span>MODE</span></div>
    <span class="rail__line rail__line--top" aria-hidden="true"></span>
    <span class="rail__scroll">SCROLL ADAPTIU</span>
    <span class="rail__line rail__line--bottom" aria-hidden="true"><i id="rail-progress"></i></span>
    <div class="rail__counter"><strong id="section-number">01</strong><span></span><small>05</small></div>
  </aside>

  <a class="brand-corner" href="#top" aria-label="Tornar a l'inici">DESORDEN.</a>

  <main id="scene-layer" aria-label="Presentació de DESORDEN">
    <section class="scene scene--opening-profile scene--opening-fallback" aria-label="Mòdul inicial DESORDEN">
      <article class="panel panel--opening-profile">
        <div class="opening-profile__bg-wrap" aria-hidden="true">
          <img class="opening-profile__bg" src="./assets/module-1-bg-rotating.png" width="540" height="810" alt="" fetchpriority="high" decoding="sync" draggable="false" />
        </div>
        <div class="opening-profile__center-hole" aria-hidden="true"></div>
        <img class="opening-profile__subject" src="./assets/module-1-subject.png" width="720" height="1080" alt="Silueta en perfil" fetchpriority="high" decoding="sync" draggable="false" />
      </article>
    </section>
  </main>

  <div class="scroll-cue" id="scroll-cue" aria-hidden="true"><span>DESLIZA</span><i></i></div>
  <div id="scroll-space" aria-hidden="true"></div>

  <noscript><style>#loader{display:none!important}.scene--opening-fallback{opacity:1!important;visibility:visible!important}</style></noscript>
  <script>
    window.__WEBL_BOOT_TIMEOUT__ = window.setTimeout(function () {
      document.getElementById('loader')?.classList.add('is-hidden');
    }, 6500);
  </script>
  <script type="module" src="./app.js?v=20260801-module-1-rotating-1"></script>
</body>
</html>
