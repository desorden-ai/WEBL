<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="DESORDEN — estratègia visual, vídeo, fotografia, dron, IA i web." />

  <link rel="stylesheet" href="./styles.css?v=20260731-desorden" />
  <link rel="stylesheet" href="./opening-profile.css?v=20260801-opening-stable-2" />
  <link rel="stylesheet" href="./hero-cleanup.css?v=20260801-centered-black-2" />

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
  <script src="./opening-profile-data-init.js?v=20260731-opening-profile-3"></script>
  <script src="./opening-profile-data/chunk-00.js?v=20260731-opening-profile-3"></script>
  <script src="./opening-profile-data/chunk-01.js?v=20260731-opening-profile-3"></script>
  <script src="./opening-profile-data/chunk-02.js?v=20260731-opening-profile-3"></script>
  <script src="./opening-profile-data/chunk-03-04.js?v=20260731-opening-profile-3"></script>
  <script src="./opening-profile-data/chunk-05-06.js?v=20260731-opening-profile-3"></script>
  <script src="./opening-profile-data/chunk-07-08.js?v=20260731-opening-profile-3"></script>
  <script src="./opening-profile-data-final.js?v=20260731-opening-profile-3"></script>
</head>
<body id="top">
  <div id="loader" class="loader" role="status" aria-live="polite">
    <img id="loader-opening-profile" class="loader__portrait" width="2160" height="3840" alt="" fetchpriority="high" decoding="sync" draggable="false" aria-hidden="true" />
    <script>
      document.getElementById('loader-opening-profile').src =
        window.__OPENING_PROFILE_DATA__ || './assets/intro-profile-1440.avif';
    </script>
    <div class="loader__meta"><span>CARREGANT</span><span id="loader-progress">0%</span></div>
    <div class="loader__line" aria-hidden="true"><span id="loader-bar"></span></div>
  </div>

  <aside class="rail" aria-label="Estat de navegació">
    <span class="rail__dot" aria-hidden="true"></span>
    <div class="rail__mode"><strong>VIDEO</strong><span>MODE</span></div>
    <span class="rail__line rail__line--top" aria-hidden="true"></span>
    <span class="rail__scroll">SCROLL ADAPTIU</span>
    <span class="rail__line rail__line--bottom" aria-hidden="true"><i id="rail-progress"></i></span>
    <div class="rail__counter"><strong id="section-number">01</strong><span></span><small>05</small></div>
  </aside>

  <a class="brand-corner" href="#top" aria-label="Tornar a l'inici">DESORDEN.</a>

  <main id="scene-layer" aria-label="Presentació de DESORDEN">
    <section class="scene scene--opening-profile scene--opening-fallback" aria-label="Retrat inicial de DESORDEN">
      <article class="panel panel--opening-profile">
        <img id="opening-fallback-image" class="opening-profile__image" width="2160" height="3840" alt="Retrat en blanc i negre de perfil" fetchpriority="high" decoding="sync" draggable="false" />
      </article>
      <script>
        document.getElementById('opening-fallback-image').src =
          window.__OPENING_PROFILE_DATA__ || './assets/intro-profile-1440.avif';
      </script>
    </section>
  </main>

  <div class="scroll-cue" id="scroll-cue" aria-hidden="true"><span>DESLIZA</span><i></i></div>
  <div id="scroll-space" aria-hidden="true"></div>

  <noscript><style>#loader{display:none!important}.scene--opening-fallback{opacity:1!important;visibility:visible!important}</style></noscript>
  <script>
    window.__WEBL_BOOT_TIMEOUT__ = window.setTimeout(function () {
      document.getElementById('loader')?.classList.add('is-hidden');
    }, 6500);
  </script>
  <script type="module" src="./app.js?v=20260801-opening-stable-2"></script>
</body>
</html>
