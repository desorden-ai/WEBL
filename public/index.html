<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="DESORDEN — estratègia visual, vídeo, fotografia, dron, IA i web." />
  <title>DESORDEN — Estratègia visual, vídeo, IA i contingut</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="preload" href="./assets/module-1-subject.png" as="image" type="image/png" />
  <link rel="stylesheet" href="./styles.css?v=20260801-hero-zoom-1" />
  <link rel="stylesheet" href="./opening-profile.css?v=20260801-hero-zoom-1" />
  <link rel="stylesheet" href="./hero-cleanup.css?v=20260801-clean-block-3" />
  <link rel="stylesheet" href="./scene-transparency.css?v=20260801-scene-transparency-1" />

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
</head>
<body id="top">
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader__meta"><span>CARREGANT</span><span id="loader-progress">0%</span></div>
    <div class="loader__line" aria-hidden="true"><span id="loader-bar"></span></div>
  </div>

  <div id="sidebar" class="sidebar" aria-label="Estat de navegació">
    <div class="sidebar-dot" aria-hidden="true"></div>
    <div class="sidebar-text sidebar-text--mode">
      <span class="text-orange">MODE</span>
      <span class="text-gray">VÍDEO</span>
    </div>
    <div class="sidebar-line sidebar-line--top" aria-hidden="true"></div>
    <div class="sidebar-text sidebar-text--scroll">
      <span class="text-gray">DESPLAÇAMENT</span>
      <span class="text-gray">ADAPTIU</span>
    </div>
    <div class="sidebar-line sidebar-line--progress" aria-hidden="true">
      <div id="rail-progress" class="sidebar-active-line"></div>
    </div>
    <div id="section-number" class="sidebar-step text-orange">01</div>
    <div class="sidebar-short-line" aria-hidden="true"></div>
    <div class="sidebar-total text-gray">05</div>
  </div>

  <a class="brand-corner" href="#top" aria-label="Tornar a l'inici">DESORDEN.</a>

  <main id="scene-layer" aria-label="Presentació de DESORDEN">
    <section class="scene scene--module-1 scene--opening-fallback" aria-label="Mòdul inicial DESORDEN">
      <article class="panel panel--module-1">
        <div class="glow-background" aria-hidden="true"></div>
        <div class="intro-text">
          <h2>SI NO ET VEUEN<br>NO ET TRIEN</h2>
        </div>
        <div class="silhouette-container">
          <img src="./assets/module-1-subject.png" width="1024" height="1536" alt="Perfil Desorden" class="zoom-silhouette" fetchpriority="high" decoding="sync" draggable="false" />
        </div>
      </article>
    </section>
  </main>

  <div class="scroll-cue" id="scroll-cue" aria-hidden="true"><span>DESLIZA</span><i></i></div>
  <div id="scroll-space" aria-hidden="true"></div>

  <noscript><style>#loader{display:none!important}.scene--opening-fallback{opacity:1!important;visibility:visible!important}</style></noscript>
  <script>
    window.__WEBL_BOOT_TIMEOUT__ = window.setTimeout(function () {
      document.getElementById('loader')?.classList.add('is-hidden');
    }, 6500);
  </script>
  <script type="module" src="./app.js?v=20260801-hero-zoom-1"></script>
</body>
</html>
