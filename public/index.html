<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scroll 3D Móvil - Experiencia Suave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#030303;--accent-color:#F29D26;--text-main:#fff;--text-muted:#888}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
body{height:8000vh;background:var(--bg-color);color:var(--text-main);font-family:'Inter',sans-serif;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:none}
body::-webkit-scrollbar{display:none}
.noise-overlay{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50;opacity:.05;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")}
#stars-canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none;opacity:.8}
#scene{position:fixed;inset:0;width:100vw;height:100vh;z-index:10;perspective:900px;pointer-events:none;display:flex;justify-content:center;align-items:center;overflow:hidden}
#world{position:absolute;transform-style:preserve-3d;width:0;height:0;will-change:transform}
.hologram{position:absolute;transform-style:preserve-3d;will-change:transform,opacity,filter;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;max-width:90vw;opacity:0}
.main-image-container{padding:6px;border:1px solid rgba(242,157,38,.4);border-radius:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(5px)}
.main-image{display:block;width:80vw;max-width:400px;height:auto;border-radius:8px;box-shadow:0 0 25px rgba(242,157,38,.15)}
.font-bebas{font-family:'Bebas Neue',cursive;text-transform:uppercase;line-height:.9}.text-orange{color:var(--accent-color)}.text-white{color:var(--text-main)}.text-muted{color:var(--text-muted);font-weight:300}
.title-huge{font-size:18vw;letter-spacing:1px;text-align:left}.title-section{font-size:15vw;text-align:left}.body-text{font-size:1.1rem;line-height:1.6;text-shadow:0 5px 15px rgba(0,0,0,.8)}
.tall-text-block{font-size:1.3rem;line-height:3;text-align:center;color:#ccc;text-shadow:0 5px 20px #000}.tall-text-block span{color:var(--accent-color);font-weight:700}.subtitle-small{font-size:.9rem;letter-spacing:3px;font-weight:600;text-transform:uppercase}
.acred-col{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}.acred-icon{font-size:3.5rem;color:var(--accent-color);font-weight:700;margin-bottom:10px}.acred-text{font-size:.9rem;color:var(--accent-color)}
.artist-card{border:1px solid rgba(242,157,38,.8);border-radius:20px;padding:20px;display:flex;align-items:center;gap:15px;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);width:85vw;position:relative}.avatar{width:60px;height:60px;border-radius:50%;background:#222;display:flex;justify-content:center;align-items:center;font-size:.6rem;color:#aaa;flex-shrink:0;border:1px solid #444;overflow:hidden}.artist-info{flex-grow:1;text-align:left}.artist-name{font-size:1.8rem;display:flex;align-items:center;gap:8px}.verified-badge{width:16px;height:16px;background:#1DA1F2;border-radius:50%;display:inline-flex;justify-content:center;align-items:center}.card-arrow{width:30px;height:30px;border:1px solid var(--accent-color);border-radius:50%;display:flex;justify-content:center;align-items:center;color:var(--accent-color);font-size:1rem}
.input-group{border:1px solid var(--accent-color);border-radius:12px;padding:15px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.9);width:85vw;backdrop-filter:blur(5px)}.input-group.textarea{align-items:flex-start;height:100px}.input-icon{color:var(--accent-color);width:20px;flex-shrink:0}.btn-primary{border:1px solid var(--accent-color);color:var(--accent-color);padding:15px;border-radius:12px;font-size:1.2rem;letter-spacing:2px;display:flex;justify-content:center;align-items:center;gap:10px;width:85vw;background:rgba(0,0,0,.9)}.btn-row{display:flex;gap:10px;width:85vw}.btn-half{flex:1;font-size:.9rem;padding:12px 5px;border:1px solid var(--accent-color);color:var(--accent-color);border-radius:12px;display:flex;justify-content:center;align-items:center;gap:5px;background:rgba(0,0,0,.9)}
#hud-top-right{position:fixed;top:40px;right:25px;z-index:100;font-family:'Bebas Neue',cursive;font-size:1.2rem;letter-spacing:2px;display:flex;gap:6px}#nav-right{position:fixed;right:20px;top:50%;transform:translateY(-50%);display:flex;align-items:center;z-index:100;height:35vh}.nav-track{position:relative;width:1px;height:100%;background:rgba(255,255,255,.4)}.nav-thumb{position:absolute;width:3px;height:20%;background:var(--accent-color);left:-1px;top:0;box-shadow:0 0 10px rgba(242,157,38,.9);will-change:top;transition:top .1s linear}#hud-bottom-left{position:fixed;bottom:30px;left:20px;z-index:100;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:#888;display:flex;align-items:center;gap:12px}#hud-section-name{color:var(--accent-color);font-weight:600;transition:opacity .3s ease}.arrow-up{display:inline-block;animation:bounce 2s infinite;font-weight:700;font-size:1.1rem;color:#fff}@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}60%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="noise-overlay"></div><canvas id="stars-canvas"></canvas>
<div id="hud-top-right"><span id="current-page" class="text-orange">01</span><span style="color:#fff">/</span><span style="color:#fff">07</span></div>
<div id="nav-right"><div class="nav-track"><div class="nav-thumb" id="nav-thumb"></div></div></div>
<div id="hud-bottom-left"><span style="color:white">SECCIÓN</span><span id="hud-section-name">INTRODUCCIÓN</span><span class="arrow-up">^</span></div>
<div id="scene"><div id="world"></div></div>
<script>
const sceneData=[
{id:'s1_1',html:'<h1 class="font-bebas text-white title-huge">TU</h1>',x:-3,y:-15,z:-1000},
{id:'s1_2',html:'<h1 class="font-bebas text-orange title-huge">PARTNER</h1>',x:2,y:5,z:-3000},
{id:'s1_3',html:'<p class="body-text text-muted" style="font-size:.9rem;letter-spacing:2px">( TECNOLÓGICO Y CREATIVO )</p>',x:0,y:25,z:-5000},
{id:'s2_img',html:'<div class="main-image-container"><img id="main-portrait" class="main-image" alt="Retrato de David Milla" width="400" height="717" decoding="async"></div>',x:0,y:-5,z:-9000},
{id:'s2_1',html:'<h2 class="font-bebas text-orange title-section">QUIÉN SOY</h2>',x:-5,y:-25,z:-12500},
{id:'s2_2',html:'<p class="body-text text-muted">David Milla, creador y director<br>de <span class="text-orange">DESORDEN.</span></p>',x:2,y:-5,z:-14500},
{id:'s2_3',html:'<p class="body-text text-muted">Dirección visual, vídeo,<br>fotografía, dron, IA y web.</p>',x:-2,y:15,z:-16500},
{id:'s2_4',html:'<p class="body-text text-muted">Un <span class="text-orange">único interlocutor</span><br>durante todo el proceso.</p>',x:4,y:35,z:-18500},
{id:'s3_1',html:'<div class="font-bebas text-orange subtitle-small" style="border-bottom:1px solid #555;padding-bottom:10px">FORMACIONES | ACREDITACIONES</div>',x:0,y:-20,z:-23000},
{id:'s3_2',html:'<div class="acred-col"><div class="acred-icon">G</div><div class="acred-text">Fundamentals of<br>Digital Marketing Certification</div></div>',x:-4,y:5,z:-25000},
{id:'s3_3',html:'<div class="acred-col"><div class="acred-icon" style="display:flex;align-items:center;justify-content:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:35px;height:35px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path></svg><span class="font-bebas" style="font-size:2.5rem">AESA</span></div><div class="acred-text">Certificación oficial de<br>piloto de dron (AESA)</div></div>',x:4,y:30,z:-27000},
{id:'s4_1',html:'<div class="artist-card"><div class="avatar">[Rosalía]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">ROSALÍA <div class="verified-badge"><svg viewBox="0 0 24 24" fill="white" style="width:10px;height:10px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div></div><div class="card-arrow">→</div></div>',x:-4,y:-25,z:-32000},
{id:'s4_2',html:'<div class="artist-card"><div class="avatar">[Rozalén]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">ROZALÉN <div class="verified-badge"><svg viewBox="0 0 24 24" fill="white" style="width:10px;height:10px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div><div style="color:var(--accent-color);font-size:1.2rem;margin-top:5px">💬 ♡ @</div></div><div class="card-arrow">→</div></div>',x:5,y:0,z:-34000},
{id:'s4_3',html:'<div class="artist-card"><div class="avatar">[Leire]</div><div class="artist-info"><div class="font-bebas text-orange artist-name">LEIRE MARTÍNEZ <div class="verified-badge"><svg viewBox="0 0 24 24" fill="white" style="width:10px;height:10px"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div></div><div style="color:var(--accent-color);margin-top:5px">···|·|||··|·|·||····</div></div><div class="card-arrow">→</div></div>',x:-3,y:25,z:-36000},
{id:'s5_1',html:'<h2 class="font-bebas text-orange title-section" style="line-height:.9">HABLEMOS DE TU<br>PROYECTO</h2>',x:-5,y:-30,z:-41000},
{id:'s5_2',html:'<p class="body-text text-white">Hacemos visible lo que tienes en mente.</p>',x:4,y:-10,z:-43000},
{id:'s5_3',html:'<div class="input-group"><div class="input-icon">👤</div><div style="color:#ddd">Nombre</div></div>',x:-2,y:5,z:-45000},
{id:'s5_4',html:'<div class="input-group"><div class="input-icon">📞</div><div style="color:#ddd">Contacto</div></div>',x:2,y:15,z:-47000},
{id:'s5_5',html:'<div class="input-group textarea"><div class="input-icon">🎯</div><div style="color:#ddd">Objetivo</div></div>',x:-2,y:28,z:-49000},
{id:'s5_6',html:'<div class="btn-primary font-bebas">HABLEMOS <span style="font-family:sans-serif">→</span></div>',x:2,y:43,z:-51000},
{id:'s5_7',html:'<div class="btn-row"><div class="btn-half font-bebas"><span style="font-family:sans-serif">💬</span> WHATSAPP</div><div class="btn-half font-bebas"><span style="font-family:sans-serif">✉</span> CORREO</div></div>',x:0,y:55,z:-53000},
{id:'s6_1',html:'<h2 class="font-bebas text-white title-section" style="text-align:center">MANIFIESTO</h2>',x:0,y:-35,z:-58000},
{id:'s6_2',html:'<div class="tall-text-block">No seguimos reglas.<br><span>Desafiamos</span> la gravedad digital.<br>Creamos espacios donde tu<br>marca <span>respira</span> libremente.<br>Donde cada píxel cuenta<br>una historia profunda.<br>Y cada <span>scroll</span> es<br>un viaje sin fin.</div>',x:0,y:10,z:-60000}
];
const worldEl=document.getElementById('world'),sceneEl=document.getElementById('scene'),navThumb=document.getElementById('nav-thumb'),currentPageEl=document.getElementById('current-page'),sectionNameEl=document.getElementById('hud-section-name');
const domElements=[];sceneData.forEach(item=>{const el=document.createElement('div');el.className='hologram';el.innerHTML=item.html;worldEl.appendChild(el);domElements.push({element:el,data:item})});
Promise.all([0,1,2,3,4].map(index=>fetch(`portrait-${index}.b64`).then(response=>response.text()))).then(parts=>{const portrait=document.getElementById('main-portrait');if(portrait)portrait.src=`data:image/jpeg;base64,${parts.join('')}`}).catch(()=>{});
const minZ=Math.min(...sceneData.map(item=>item.z)),requiredCameraTravel=Math.abs(minZ)+5000;
let currentScroll=0,targetScroll=0,globalPanX=0,globalPanY=0,activePage=1,sectionTimer=0;const lerpFactor=.06;const sectionNames=['INTRODUCCIÓN','LA IMAGEN','QUIÉN SOY','FORMACIONES','ARTISTAS','PROYECTO','MANIFIESTO'];
addEventListener('scroll',()=>{targetScroll=scrollY},{passive:true});
function updateScene(){
 currentScroll+=(targetScroll-currentScroll)*lerpFactor;
 const maxScrollableHeight=document.documentElement.scrollHeight-innerHeight;
 const scrollProgress=maxScrollableHeight>0?Math.min(1,Math.max(0,currentScroll/maxScrollableHeight)):0;
 const cameraZ=currentScroll*(requiredCameraTravel/maxScrollableHeight);
 const t=Math.min(1,Math.max(0,cameraZ/requiredCameraTravel)),adjustedT=Math.pow(t,1.2);
 globalPanX=Math.sin(adjustedT*Math.PI*1.5)*12;globalPanY=Math.sin(t*Math.PI*2.5)*4;
 sceneEl.style.perspectiveOrigin=`${50+globalPanX}% ${50+globalPanY}%`;worldEl.style.transform=`rotateX(${Math.sin(t*Math.PI*2.5)*1.5}deg) rotateY(${-Math.cos(adjustedT*Math.PI*1.5)*2}deg)`;
 const cx=innerWidth/100,cy=innerHeight/100;navThumb.style.top=`${scrollProgress*80}%`;
 let nextPage=1;if(scrollProgress<.1)nextPage=1;else if(scrollProgress<.22)nextPage=2;else if(scrollProgress<.38)nextPage=3;else if(scrollProgress<.52)nextPage=4;else if(scrollProgress<.68)nextPage=5;else if(scrollProgress<.85)nextPage=6;else nextPage=7;
 if(nextPage!==activePage){activePage=nextPage;currentPageEl.textContent=String(activePage).padStart(2,'0');sectionNameEl.style.opacity='0';clearTimeout(sectionTimer);sectionTimer=setTimeout(()=>{sectionNameEl.textContent=sectionNames[activePage-1];sectionNameEl.style.opacity='1'},150)}
 domElements.forEach(item=>{const z=item.data.z+cameraZ,optimalZ=-600,distance=Math.abs(z-optimalZ),core=1200,transition=3500;let opacity=distance>core?1-(distance-core)/transition:1;opacity=Math.max(0,Math.min(1,opacity));const blur=Math.max(0,Math.min(3,(distance-core)/2500));if(opacity>.01){item.element.style.display='block';item.element.style.transform=`translate(-50%,-50%) translate3d(${item.data.x*cx}px,${item.data.y*cy}px,${z}px)`;item.element.style.opacity=opacity;item.element.style.filter=blur>.05?`blur(${blur}px)`:'none'}else item.element.style.display='none'});
 requestAnimationFrame(updateScene)
}
const canvas=document.getElementById('stars-canvas'),ctx=canvas.getContext('2d');let width=0,height=0,stars=[],lastScrollForStars=0;const numStars=250;
function initStars(){const dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=`${width}px`;canvas.style.height=`${height}px`;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:numStars},()=>({x:(Math.random()-.5)*width*3,y:(Math.random()-.5)*height*3,z:Math.random()*2000,radius:Math.random()*1.5}))}
function renderStars(){ctx.clearRect(0,0,width,height);const scrollDelta=Math.abs(currentScroll-lastScrollForStars);lastScrollForStars=currentScroll;const speed=.35+scrollDelta*.18,centerX=width/2+(globalPanX/12)*(width*.12),centerY=height/2+(globalPanY/4)*(height*.04);ctx.fillStyle='rgba(242,157,38,.8)';for(const star of stars){star.z-=speed;if(star.z<=0){star.x=(Math.random()-.5)*width*3;star.y=(Math.random()-.5)*height*3;star.z=2000}const k=900/star.z,px=star.x*k+centerX,py=star.y*k+centerY;if(px>=0&&px<=width&&py>=0&&py<=height){ctx.beginPath();ctx.arc(px,py,Math.max(.1,star.radius*k),0,Math.PI*2);ctx.fill()}}requestAnimationFrame(renderStars)}
addEventListener('resize',initStars,{passive:true});initStars();renderStars();updateScene();
</script>
</body>
</html>
