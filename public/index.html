<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="DESORDEN — estratègia visual, vídeo, fotografia, dron, IA i web." />
  <title>DESORDEN — Estratègia visual, vídeo, IA i contingut</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="./assets/intro-profile-1440.avif" type="image/avif" fetchpriority="high" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20260731-desorden" />
  <link rel="stylesheet" href="./opening-profile.css?v=20260731-opening-profile-1" />
</head>
<body id="top">
  <div id="loader" class="loader" role="status" aria-live="polite">
    <img
      class="loader__portrait"
      src="./assets/intro-profile-1440.avif"
      width="1440"
      height="2560"
      alt=""
      fetchpriority="high"
      decoding="sync"
      draggable="false"
      aria-hidden="true"
    />
    <div class="loader__portrait-shade" aria-hidden="true"></div>
    <div class="loader__brand" aria-hidden="true">DES<br>ORDEN.</div>
    <div class="loader__line"><span id="loader-bar"></span></div>
    <div class="loader__meta"><span>CARREGANT</span><span id="loader-progress">0%</span></div>
  </div>

  <aside class="rail" aria-label="Estat de navegació">
    <span class="rail__dot" aria-hidden="true"></span>
    <div class="rail__mode"><strong>VIDEO</strong><span>MODE</span></div>
    <span class="rail__line rail__line--top" aria-hidden="true"></span>
    <span class="rail__scroll">SCROLL ADAPTIU</span>
    <span class="rail__line rail__line--bottom" aria-hidden="true"><i id="rail-progress"></i></span>
    <div class="rail__counter"><strong id="section-number">01</strong><span></span><small>05</small></div>
  </aside>

  <a class="brand-corner" href="#top" aria-label="Tornar a l'inici">DESORDEN.</a>

  <main id="scene-layer" aria-label="Presentació de DESORDEN">
    <section class="fallback-intro" aria-label="Presentació inicial">
      <div class="fallback-intro__title">SI NO TE VEN<br>NO TE ELIGEN</div>
    </section>
  </main>

  <div class="scroll-cue" id="scroll-cue" aria-hidden="true"><span>DESLIZA</span><i></i></div>
  <div id="scroll-space" aria-hidden="true"></div>

  <noscript><style>#loader{display:none!important}.fallback-intro{opacity:1!important;visibility:visible!important}</style></noscript>
  <script>
    window.__WEBL_BOOT_TIMEOUT__ = window.setTimeout(function () {
      document.getElementById('loader')?.classList.add('is-hidden');
    }, 4200);
  </script>
  <script type="module" src="./app.js?v=20260731-opening-profile-1"></script>
</body>
</html>
