<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>David Milla - Creativo | Portada Épica 3D</title>
  <meta name="description" content="Portfolio interactivo 3D de David Milla. Dirección visual, vídeo, fotografía, dron, IA y diseño web. Tu partner tecnológico y creativo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cover-v6.css?v=1">
  <link rel="stylesheet" href="lcp-v12.css?v=2">
  <link rel="stylesheet" href="portrait-inline-v13.css?v=1">
  <style>
    /* Portada fiable: fuera del world 3D de tamaño 0. */
    #hero-reliable {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      pointer-events: none;
      perspective: 900px;
      opacity: 1;
      visibility: visible;
      transition: opacity .45s ease;
    }
    #hero-reliable.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    #hero-reliable #lcp-stardust {
      position: absolute !important;
      left: 50% !important;
      top: 50% !important;
      width: min(90vw, 650px) !important;
      max-width: 650px !important;
      aspect-ratio: 360 / 645;
      opacity: 1 !important;
      visibility: visible !important;
      display: block !important;
      transform: translate(-50%,-50%) translate3d(4vw,22vh,-600px);
    }
    #lcp-portrait {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-label="Cargando experiencia">
    <div id="loader-text-3d" class="font-bebas" aria-hidden="true">D</div>
  </div>

  <div id="cookie-wrapper">
    <p class="cookie-text">ESTA WEB UTILIZA COOKIES PARA OFRECER LA MEJOR EXPERIENCIA 3D.</p>
    <button id="btn-accept-cookies" class="font-bebas" type="button">ACEPTAR Y ENTRAR</button>
  </div>

  <div class="noise-overlay"></div>
  <h1 id="seo-header" class="font-bebas">DAVID MILLA <span class="text-orange">CREATIVO</span></h1>

  <button id="hud-top-right" type="button" aria-controls="nav-menu" aria-expanded="false" aria-label="Abrir navegación por secciones">
    <span id="hud-page-number" class="text-orange">01</span><span style="color:#fff">/ 07</span><span class="menu-arrow" aria-hidden="true">▼</span>
  </button>

  <nav id="nav-menu" aria-label="Navegación por secciones">
    <button class="menu-item active" type="button" data-target="0">INICIO</button>
    <button class="menu-item" type="button" data-target="1000">INTRODUCCIÓN</button>
    <button class="menu-item" type="button" data-target="4000">QUIÉN SOY</button>
    <button class="menu-item" type="button" data-target="8000">FORMACIONES</button>
    <button class="menu-item" type="button" data-target="11500">ARTISTAS</button>
    <button class="menu-item" type="button" data-target="15000">PROYECTO</button>
    <button class="menu-item" type="button" data-target="21500">MANIFIESTO</button>
  </nav>

  <div id="nav-right" aria-hidden="true"><div class="nav-track"><div class="nav-thumb" id="nav-thumb"></div></div></div>

  <!-- La portada se mantiene en una capa de viewport independiente del motor. -->
  <div id="hero-reliable" aria-hidden="true">
    <div id="lcp-stardust" class="hologram stardust-container" role="img" aria-label="David Milla, creativo y director de DESORDEN">
      <img id="lcp-portrait" class="stardust-real-img" src="/1000091876.jpg" alt="" width="360" height="645" loading="eager" decoding="async" draggable="false" aria-hidden="true">
      <canvas id="lcp-stardust-canvas" class="stardust-canvas" aria-hidden="true"></canvas>
    </div>
  </div>

  <div id="scene"><div id="world"></div></div>

  <script src="performance-v8.js?v=5" defer></script>
  <script src="lcp-v12.js?v=2" defer></script>
  <script defer>
    window.addEventListener('DOMContentLoaded', () => {
      const hero = document.getElementById('hero-reliable');
      const page = document.getElementById('hud-page-number');
      if (!hero || !page) return;
      const syncHero = () => hero.classList.toggle('is-hidden', page.textContent.trim() !== '01');
      syncHero();
      new MutationObserver(syncHero).observe(page, { childList: true, characterData: true, subtree: true });
    });
  </script>
</body>
</html>
