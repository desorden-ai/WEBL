<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>David Milla - Creativo | Portada Épica 3D</title>
  <meta name="description" content="Portfolio interactivo 3D de David Milla. Dirección visual, vídeo, fotografía, dron, IA y diseño web. Tu partner tecnológico y creativo.">

  <link rel="preload" href="1000091876.jpg" as="image" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cover-v6.css?v=1">

  <style>
    body { font-family: 'Inter', Arial, sans-serif; }
    .font-bebas,
    #loader-text-3d,
    #btn-accept-cookies,
    #hud-top-right,
    .menu-item {
      font-family: 'Bebas Neue', Impact, sans-serif;
    }

    #scene {
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    body.ready #scene { opacity: 1; }

    .stardust-container { will-change: transform; }
    .stardust-real-img { will-change: opacity; }
    .stardust-canvas {
      position: absolute;
      inset: auto;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      z-index: 2;
      pointer-events: none;
      will-change: opacity;
    }

    #seo-header,
    #hud-top-right {
      top: 40px;
      font-size: 1.1rem;
      line-height: 1;
      letter-spacing: 2px;
    }

    #seo-header {
      position: fixed;
      left: 25px;
      z-index: 100;
      margin: 0;
      color: var(--text-main);
      font-weight: 400;
      white-space: nowrap;
    }

    #hud-top-right {
      position: fixed;
      right: 25px;
      z-index: 102;
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--accent-color);
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #hud-page-number { transition: opacity 0.3s ease; }

    .menu-arrow {
      display: inline-block;
      margin-left: 4px;
      font-size: 0.8rem;
      transition: transform 0.3s ease;
    }

    #hud-top-right[aria-expanded="true"] .menu-arrow {
      transform: rotate(180deg);
    }

    #nav-menu {
      position: fixed;
      top: 70px;
      right: 25px;
      z-index: 101;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      text-align: right;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #nav-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .menu-item {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      font-size: 1.3rem;
      line-height: 1;
      letter-spacing: 2px;
      text-align: right;
      color: var(--text-main);
      cursor: pointer;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 5px rgba(0,0,0,0.8);
      transition: color 0.3s ease;
    }

    .menu-item:hover,
    .menu-item:focus-visible,
    .menu-item.active {
      color: var(--accent-color);
      outline: none;
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-label="Cargando experiencia">
    <div id="loader-text-3d" class="font-bebas" aria-hidden="true">D</div>
    <div id="cookie-wrapper">
      <p class="cookie-text">ESTA WEB UTILIZA COOKIES PARA OFRECER LA MEJOR EXPERIENCIA 3D.</p>
      <button id="btn-accept-cookies" class="font-bebas" type="button">ACEPTAR Y ENTRAR</button>
    </div>
  </div>

  <div class="noise-overlay"></div>

  <h1 id="seo-header" class="font-bebas">DAVID MILLA <span class="text-orange">CREATIVO</span></h1>

  <button id="hud-top-right" type="button" aria-controls="nav-menu" aria-expanded="false" aria-label="Abrir navegación por secciones">
    <span id="hud-page-number" class="text-orange">01</span>
    <span style="color:#fff">/ 07</span>
    <span class="menu-arrow" aria-hidden="true">▼</span>
  </button>

  <nav id="nav-menu" aria-label="Navegación por secciones">
    <button class="menu-item active" type="button" data-target="0">INICIO</button>
    <button class="menu-item" type="button" data-target="1000">INTRODUCCIÓN</button>
    <button class="menu-item" type="button" data-target="4000">QUIÉN SOY</button>
    <button class="menu-item" type="button" data-target="8000">FORMACIONES</button>
    <button class="menu-item" type="button" data-target="11500">ARTISTAS</button>
    <button class="menu-item" type="button" data-target="15000">PROYECTO</button>
    <button class="menu-item" type="button" data-target="21500">MANIFIESTO</button>
  </nav>

  <div id="nav-right" aria-hidden="true">
    <div class="nav-track"><div class="nav-thumb" id="nav-thumb"></div></div>
  </div>

  <div id="scene"><div id="world"></div></div>

  <script src="performance-v8.js?v=1" defer></script>
</body>
</html>
